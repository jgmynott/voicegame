     Titan One: chunky bubble letters for the logo, headings and buttons. Fredoka: body text. -->

<style>
@font-face{font-family:"Fredoka";font-style:normal;font-weight:300 700;font-stretch:100%;font-display:swap;src:url(fonts/fredoka-latin.woff2) format("woff2");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
/* Titan One has one weight. Declaring it for the whole weight range stops browsers from faking a bold on top of it. */
@font-face{font-family:"Titan One";font-style:normal;font-weight:100 900;font-display:swap;src:url(fonts/titan-one-latin.woff2) format("woff2");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
/* Layout: phone-first stage. A thin bar on top, one main action per screen, centered.
   Look: white and orange, chunky bubble letters (Titan One) with a brownish-green offset shadow for the
   logo and headings, a pudgy rounded body font (Fredoka at a heavy weight), flat shapes. */
:root{
  --bg:#f8f3ec; --card:#efe8df; --ink:#2a2622; --dim:#7a726a; --line:#e3d9cd; --surface:#fdfaf5;
  --a:#e5712d; --a-dk:#55583a; --b:#2a2622; --b-dk:#55583a; --shadow:#55583a;
  --gold:#e5712d; --gold-dk:#55583a; --good:#26934e; --good-dk:#1b6e3a; --bad:#c83a3a;
  --paper:#fbf0e5; --paper-ink:#1c1917; --on-team:#ffffff;
  --tA:var(--a); --tA-dk:var(--a-dk); --tB:#2a2622; --tB-dk:#55583a;
  --team:var(--tA); --team-dk:var(--tA-dk);
  --solid:#2a2622; --on-solid:#ffffff; --tInk:#2a2622; --outline:#2a2622; --okbg:#e4efe5;
  --f-d:"Titan One","Fredoka","Arial Rounded MT Bold",system-ui,sans-serif;
  --f-b:"Fredoka",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
body{--team:var(--tA);--team-dk:var(--tA-dk)}
body[data-team="1"]{--team:var(--tB);--team-dk:var(--tB-dk)}
/* Dark theme: follows the phone unless the player picks Light or Dark in Settings. */
:root[data-theme="dark"]{--bg:#1c1a17; --card:#2b2723; --ink:#f3ece3; --dim:#a89f95; --line:#3d3832; --surface:#24211d; --paper:#33291f;
  --solid:#efe6da; --on-solid:#1c1a17; --okbg:#203a28; --tB:#4d4740; --tInk:#4d4740; color-scheme:dark}
:root[data-text="lg"]{font-size:115%}
:root[data-motion="reduce"] *{animation:none!important;transition:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-b);font-weight:600;font-size:1.0625rem;line-height:1.35;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 24px;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
input{user-select:text;-webkit-user-select:text}
.wrap{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
h1,h2,.d{font-family:var(--f-d);font-weight:600;margin:0;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
.dim{color:var(--dim)}
b{font-weight:700}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0 10px}
.logo{font-family:var(--f-d);font-weight:600;font-size:1.15rem;display:flex;gap:0;align-items:center;letter-spacing:-.01em;background:none;border:none;color:var(--ink);padding:6px 6px 6px 0;margin:0;cursor:pointer;min-height:40px}
.logo .bk{display:inline-block;width:.9em;margin-right:2px;font-size:1.3rem;line-height:1;color:var(--dim)}
.logo .w{color:var(--a)}
.logo span:not(.bk){text-shadow:.04em .07em 0 var(--shadow)}
.scores{display:flex;align-items:center;gap:6px;font-family:var(--f-d);font-weight:600;font-size:1.1rem;font-variant-numeric:tabular-nums}
.scores .s{padding:3px 10px;border-radius:999px;min-width:2.4em;text-align:center;color:#fff}
.scores .sa{background:var(--tA)} .scores .sb{background:var(--tB)}
.scores .on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px currentColor}
.scores .sa.on{color:#fff;box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--tA)} .scores .sb.on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--tB)}
.iconbtn{width:40px;height:40px;border-radius:12px;border:none;background:var(--card);color:var(--ink);font-size:1.2rem;cursor:pointer;display:grid;place-items:center}

.stage{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;padding-block:8px;animation:enter .22s ease-out}
/* A re-render of the same screen (a tap, a server update) must not replay the entrance animations. */
.stage.still,.stage.still .word,.stage.still .splash,.stage.still .bet,.stage.still .stamp,.stage.still .delta,.stage.still.shake{animation:none}
@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.center{text-align:center;align-items:center}
.kicker{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:600}
.huge{font-size:clamp(2.6rem,13vw,4rem);line-height:.95}
.big-t{font-size:clamp(1.8rem,8.5vw,2.4rem);line-height:1.05;text-shadow:.04em .06em 0 rgba(85,88,58,.28)}

/* buttons: flat, rounded, a small press */
.btn{font-family:var(--f-d);font-weight:600;font-size:1.3rem;border:none;border-radius:16px;padding:16px 20px;cursor:pointer;width:100%;
  background:var(--a);color:#fff;box-shadow:0 4px 0 var(--a-dk);transition:transform .06s, box-shadow .06s;letter-spacing:.02em;text-shadow:0 .08em 0 rgba(85,88,58,.55)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--a-dk)}
.btn.team{background:var(--team);color:#fff;box-shadow:0 4px 0 var(--team-dk)}
.btn.team:active{box-shadow:0 1px 0 var(--team-dk)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:none;font-size:1.05rem;padding:13px;text-shadow:none}
.btn.ghost:active{background:var(--line)}
.btn svg{width:1.1em;height:1.1em;vertical-align:-.15em}
.btn:disabled{opacity:.35;pointer-events:none}
.link{background:none;border:none;color:var(--dim);font:600 .95rem var(--f-b);text-decoration:underline;cursor:pointer;padding:8px}
button:focus-visible,input:focus-visible{outline:3px solid var(--a);outline-offset:3px}
.row{display:flex;gap:12px}
.row>*{flex:1}

/* mic */
.micwrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.mic{--lvl:0;position:relative;width:min(52vw,190px);aspect-ratio:1;max-width:100%;border-radius:50%;border:none;cursor:pointer;color:#fff;
  background:var(--a);box-shadow:0 6px 0 var(--a-dk);display:grid;place-items:center;transition:transform .1s;isolation:isolate}
/* level ring: scaled with transform so the live meter is composited instead of repainting a shadow every frame */
.mic::before{content:"";position:absolute;inset:-8px;border-radius:50%;background:rgba(229,113,45,.18);z-index:-1;pointer-events:none;
  transform:scale(calc(1 + var(--lvl)*.38));transition:transform .08s linear;will-change:transform}
.mic.done::before{background:rgba(38,147,78,.16)}
.mic:active{transform:translateY(4px);box-shadow:0 2px 0 var(--a-dk)}
.mic svg{width:36%;height:36%}
.mic.rec{animation:throb 1s infinite}
.mic.done{background:var(--good);box-shadow:0 6px 0 var(--good-dk)}
.mic .ring{position:absolute;inset:-14px;border-radius:50%;pointer-events:none}
@keyframes throb{50%{transform:scale(1.04)}}
.miclabel{font-family:var(--f-d);font-weight:600;font-size:1.25rem}
.timer{font-variant-numeric:tabular-nums;color:var(--dim);font-size:.95rem;height:1.2em}

/* play */
.play{position:relative;width:min(48vw,170px);aspect-ratio:1;max-width:100%;border-radius:50%;border:none;cursor:pointer;color:#fff;
  background:var(--solid);color:var(--on-solid);box-shadow:0 6px 0 var(--shadow);display:grid;place-items:center}
.play:active{transform:translateY(4px);box-shadow:0 2px 0 var(--shadow)}
.play svg{width:38%;height:38%}
.play.spin svg{animation:spin .8s linear infinite}
.play:disabled{opacity:.3}
@keyframes spin{to{transform:rotate(-360deg)}}
.play.sm{width:min(28vw,96px);box-shadow:0 4px 0 var(--shadow)}
.pips{display:flex;gap:10px;justify-content:center}
.pips i{width:16px;height:16px;border-radius:50%;background:var(--a);display:block}
.pips i.used{background:var(--line)}

/* word card */
.card{background:var(--card);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px}
.word{background:var(--paper);color:var(--ink);border:2px solid var(--a);border-radius:18px;padding:20px 18px;text-align:center;font-family:var(--f-d);font-weight:600;
  font-size:clamp(1.8rem,8.5vw,2.5rem);line-height:1.05;animation:pop .35s ease-out;word-break:break-word}
.word.sm{font-size:clamp(1.3rem,6.5vw,1.8rem);padding:12px 16px}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.lrow{display:flex;gap:16px;align-items:center;justify-content:center}
.lrow .dim{text-align:left;max-width:160px;margin:0}
.sylls{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.sylls i{width:12px;height:12px;border-radius:50%;background:var(--a);display:block}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:6px 14px;font-weight:600;font-size:.9rem}

/* splash */
.splash{background:var(--team);color:#fff;border-radius:24px;padding:30px 20px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;animation:pop .35s ease-out}
.who{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.who div{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.av{width:58px;height:58px;border-radius:50%;background:#fff;color:var(--team);font-family:var(--f-d);font-weight:600;font-size:1.7rem;display:grid;place-items:center}
.who span{font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.who b{font-size:1.05rem;max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* bet board */
.bets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bet{border:none;border-radius:16px;padding:14px 6px;cursor:pointer;color:#fff;font-family:var(--f-d);font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;
  box-shadow:0 4px 0 var(--shadow);animation:enter .3s backwards}
.bet:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
.bet .n{font-size:2.4rem;line-height:1}
.bet .s{font-size:.7rem;letter-spacing:.1em;opacity:.9;font-weight:600}
.bet .p{font-size:1.05rem}
.bet .m{font-size:.75rem;opacity:.85;font-weight:600}

/* inputs */
.inp{width:100%;box-sizing:border-box;font:600 1.3rem var(--f-b);padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);text-align:center}
.inp:focus{border-color:var(--a);outline:none}
.sm{font-size:1rem;padding:11px;text-align:left}

/* reveal */
.stamp{font-family:var(--f-d);font-weight:700;font-size:clamp(2.4rem,12vw,3.4rem);padding:2px 16px;border:5px solid currentColor;border-radius:14px;transform:rotate(-6deg);animation:stamp .4s ease-out backwards;display:inline-block}
.stamp.good{color:var(--good)} .stamp.bad{color:var(--bad)}
@keyframes stamp{from{transform:scale(2) rotate(-6deg);opacity:0}to{transform:rotate(-6deg);opacity:1}}
.delta{font-family:var(--f-d);font-weight:600;font-size:2.8rem;animation:enter .4s .3s backwards}
.delta.good{color:var(--good)} .delta.bad{color:var(--bad)}
.drum{font-family:var(--f-d);font-weight:600;font-size:2rem;animation:wobble .18s infinite}
@keyframes wobble{50%{transform:scale(1.06) rotate(2deg)}}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.chain{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chain .btn{font-size:.95rem;padding:12px 8px}

/* title, setup */
.title{text-align:center;padding:10px 0 4px}
.title .huge{font-size:clamp(2.2rem,14vw,4.4rem);font-weight:700}
.title .mirror{display:block;transform:scaleX(-1);color:var(--a)}
/* Bubble letters: a dark outline drawn behind the fill, and a solid brownish-green offset shadow. */
.title .huge,.code{-webkit-text-stroke:.09em var(--outline);paint-order:stroke fill;text-shadow:.05em .08em 0 var(--shadow)}
.title .huge:not(.mirror){color:#fff}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{font:600 .95rem var(--f-b);padding:9px 14px;border-radius:999px;border:none;background:var(--surface);color:var(--dim);cursor:pointer}
.seg button[aria-checked="true"]{background:var(--a);color:#fff}
.lbl{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:600}
.teamrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tA{border-left:5px solid var(--tA);padding-left:10px;display:flex;flex-direction:column;gap:8px}
.tB{border-left:5px solid var(--tB);padding-left:10px;display:flex;flex-direction:column;gap:8px}
.err{color:var(--bad);text-align:center}

/* overlay menu */
.overlay{position:fixed;inset:0;background:rgba(42,38,34,.35);z-index:20;overflow:auto;
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px))}
.overlay .card{max-width:480px;margin:0 auto;background:var(--surface)}
.overlay ul{margin:0;padding-left:20px;font-weight:500;display:flex;flex-direction:column;gap:6px}
.tag{font-size:.65rem;color:var(--a);border:1px solid var(--a);border-radius:4px;padding:0 4px;margin-left:4px;font-weight:600}
#fx{position:fixed;inset:0;pointer-events:none;z-index:30;width:100%;height:100%}
.code{font-family:var(--f-d);font-weight:700;font-size:clamp(3.2rem,17vw,4.6rem);letter-spacing:.16em;line-height:1;color:var(--a)}
.dots{display:flex;gap:8px;justify-content:center}
.dots i{width:11px;height:11px;border-radius:50%;background:currentColor;opacity:.85;animation:bob 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bob{50%{transform:translateY(-7px);opacity:.4}}
.pl{font-weight:600;font-size:1.05rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl.off{opacity:.45}

/* daily */
.daily-cta{border:2px solid var(--a);color:var(--a);background:var(--surface);box-shadow:none}
.daily-cta:active{background:var(--paper)}
.drow{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:12px;background:var(--card);font-weight:600;text-align:left;width:100%;box-sizing:border-box}
.drow.no span{color:var(--bad)} .drow.ok{background:var(--okbg)} .drow.ok span{color:var(--good)}
.hint{padding:8px 14px;border-radius:12px;background:var(--paper);color:var(--ink);font-weight:600;width:100%;box-sizing:border-box;text-align:left;letter-spacing:.02em}
.fbw{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.fbw i,.legend i{font-style:normal;padding:3px 9px;border-radius:8px;font-weight:600}
.fb-g{background:var(--good);color:#fff} .fb-y{background:#daa71b;color:#2a2622} .fb-n{background:#f8dac6;color:#2a2622} .fb-x{background:#e5ddd3;color:#7a726a}
.heat{font-style:normal;font-size:.8rem;font-weight:600;white-space:nowrap;padding:3px 8px;border-radius:999px;background:var(--surface)}
.heat.h3{color:var(--good)} .heat.h2{color:var(--a)} .heat.h1{color:#a1561c} .heat.h0{color:var(--dim)}
.legend{font-size:.75rem;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:0}
.legend span{width:100%;text-align:center}
.howto{margin:0;font-weight:600;font-size:.95rem}
.legend i{font-size:.75rem;padding:2px 7px}
.seg.speed{justify-content:center}
.seg.speed button{background:var(--card)}
.seg.speed button[aria-checked="true"]{background:var(--solid);color:var(--on-solid)}
.dstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.dstats div{display:flex;flex-direction:column;font-size:.8rem;color:var(--dim)}
.dstats b{font-size:1.6rem;color:var(--ink)}
@media (prefers-reduced-motion:reduce){:root:not([data-motion="full"]) *{animation:none!important}}
/* settings, tutorial, extras */
.set{display:flex;flex-direction:column;gap:8px}
.set .line{display:flex;align-items:center;justify-content:space-between;gap:12px}
.set .line>span{min-width:4.2em}
.overlay .seg button{background:var(--card)}
.set input[type=range]{flex:1;accent-color:var(--a);height:28px}
.sw{position:relative;width:52px;height:30px;border-radius:999px;border:none;background:var(--line);cursor:pointer;flex:none;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw[aria-checked="true"]{background:var(--a)} .sw[aria-checked="true"]::after{transform:translateX(22px)}
.links{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 10px}
.steps{display:flex;gap:6px;justify-content:center}
.steps i{width:9px;height:9px;border-radius:50%;background:var(--line);display:block}
.steps i.on{background:var(--a)}
.tut{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:8px 0}
.tut .ico{font-size:3.4rem;line-height:1;width:96px;height:96px;border-radius:50%;background:var(--paper);display:grid;place-items:center}
.sw-row{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:30px;height:30px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0;box-shadow:0 2px 0 var(--shadow)}
.swatch[aria-checked="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--bg) inset}
.prow{display:flex;gap:6px;align-items:center}
.prow .inp{flex:1}
.xbtn{flex:none;width:34px;height:34px;border-radius:10px;border:none;background:var(--card);color:var(--dim);cursor:pointer;font-size:1rem}
.gtime{font-family:var(--f-d);font-size:1.6rem;font-variant-numeric:tabular-nums;color:var(--team)}
.gtime.low{color:var(--bad);animation:throb .5s infinite}
.small{font-size:.9rem;font-weight:500}
.stcard{width:100%;box-sizing:border-box;text-align:left;gap:10px}
.mrow{display:flex;flex-direction:column;gap:1px}.mrow span{color:var(--dim);font-size:.9rem}
.srow{display:grid;grid-template-columns:minmax(0,7em) 1fr auto 2.8em;gap:8px;align-items:center;font-size:.9rem}
.srow span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbar{height:10px;border-radius:999px;background:var(--surface);overflow:hidden}.sbar i{display:block;height:100%;background:var(--a);border-radius:999px}
.srow em{font-style:normal;color:var(--dim);text-align:right}
.scode{letter-spacing:.08em;white-space:nowrap}
</style>

<script>
// ---------- Player settings: saved on this phone only ----------
let fxGain=null, voiceGain=null;
const CFG = Object.assign({fx:0.8, voice:1, haptics:true, theme:"auto", motion:"auto", text:"md"},
  (()=>{ try{ return JSON.parse(localStorage.getItem("bs-settings")||"{}")||{}; }catch(e){ return {}; } })());

// ---------- confetti ----------
const fx=document.getElementById("fx"), fxg=fx.getContext("2d"); let parts=[], fxOn=false;
function confetti(n=140){
  if(reducedMotion()) return;
  const w=innerWidth, cols=["#e5712d","#ec9d65","#2a2622","#f4c6a5","#b6551b","#7a726a"];
  for(let i=0;i<n;i++) parts.push({x:w/2+(Math.random()-.5)*80,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*15-5,r:Math.random()*6+4,c:cols[i%cols.length],a:Math.random()*6,va:(Math.random()-.5)*.4,life:120+Math.random()*60});
  if(!fxOn){ fxOn=true; requestAnimationFrame(tickFx); }
}
function tickFx(){
  // Round the canvas size: on phones with fractional pixel ratios the unrounded compare was true every frame,
  // which reallocated the full-screen canvas 60 times a second.
  const dpr=Math.min(2,devicePixelRatio||1), W=Math.round(innerWidth*dpr), H=Math.round(innerHeight*dpr);
  if(fx.width!==W || fx.height!==H){ fx.width=W; fx.height=H; }
  fxg.setTransform(dpr,0,0,dpr,0,0); fxg.clearRect(0,0,innerWidth,innerHeight);
  for(const p of parts){ p.vy+=.45; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.a+=p.va; p.life--;
    const c=Math.cos(p.a)*dpr, s=Math.sin(p.a)*dpr; fxg.setTransform(c,s,-s,c,p.x*dpr,p.y*dpr); fxg.fillStyle=p.c; fxg.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); }
  fxg.setTransform(dpr,0,0,dpr,0,0);
  parts=parts.filter(p=>p.life>0 && p.y<innerHeight+40);
  if(parts.length) requestAnimationFrame(tickFx); else { fxOn=false; fxg.clearRect(0,0,innerWidth,innerHeight); }
}

// ---------- mic with level meter ----------
let analyser=null, meterRaf=0, recTimer=0, recStart=0;
// The mic is opened once per visit (on the first Play, Daily, Free play, Create or Join tap) and
// kept open. Chrome and other in-app browsers on iPhone ask for (or delay) mic access on every
// new request, so it is never closed between recordings, screens or modes. While it is open iOS uses play-and-record,
// which also ignores the silent switch.
async function ensureMic(){
  try{ await getStream(); S.micError=""; return true; }
  catch(e){ let framed=false; try{ framed=window.top!==window.self; }catch(_){ framed=true; }
    S.micError = framed ? "The mic is blocked in this preview. Open the game from its own app link to record." : location.protocol==="https:"||location.hostname==="localhost" ? "Microphone blocked. Allow mic access for this site in your browser settings, then reload." : "This page needs to be opened from its https link to use the mic."; return false; }
}
async function recordInto(key,btn,onDone){
  if(activeRec){ stopRec(); return; }
  stopPlay();
  if(!(await ensureMic())){ render(); return; }
  SFX.recOn(); buzz(30);
  await new Promise(r=>setTimeout(r,180));
  const s=await getStream(); const chunks=[]; let mr;
  try{ mr=new MediaRecorder(s); }catch(e){ releaseMic(); S.micError="Recording is not supported in this browser."; render(); return; }
  mr.ondataavailable=e=>{ if(e.data && e.data.size) chunks.push(e.data); };
  mr.onstop=async()=>{
    clearTimeout(mr._t); cancelAnimationFrame(meterRaf); clearInterval(recTimer); activeRec=null;
    if(releaseAfterRec) releaseMic();
    SFX.recOff(); buzz(20);
    try{ const blob=new Blob(chunks,{type:mr.mimeType||"audio/mp4"}); const buf=trimBuf(await cleanBuf(await decode(await blob.arrayBuffer()))); S.turn[key]=buf; onDone(buf,blob); }
    catch(e){ S.micError="Could not read that recording. Try again."; render(); }
  };
  mr.start(); activeRec=mr; recStart=Date.now();
  mr._t=setTimeout(()=>{ if(mr.state==="recording") mr.stop(); },REC_LIMIT);
  btn.classList.add("rec"); btn.innerHTML=ICON.stop;
  const lbl=document.getElementById("micLbl"), tm=document.getElementById("micTimer");
  if(lbl) lbl.textContent="Tap to stop";
  recTimer=setInterval(()=>{ if(tm) tm.textContent=((Date.now()-recStart)/1000).toFixed(1)+"s"; },100);
  try{
    const c=ac(); if(!analyser || analyser._s!==s){ analyser=c.createAnalyser(); analyser.fftSize=512; c.createMediaStreamSource(s).connect(analyser); analyser._s=s; }
    const data=new Uint8Array(analyser.fftSize);
    let last=-1;
    const loop=()=>{ analyser.getByteTimeDomainData(data); let m=0; for(let i=0;i<data.length;i++){ const d=Math.abs(data[i]-128); if(d>m) m=d; }
      const lv=Math.round(Math.min(1,m/128*1.8)*20)/20; if(lv!==last){ last=lv; btn.style.setProperty("--lvl",lv); } meterRaf=requestAnimationFrame(loop); };
    loop();
  }catch(e){}
}

function newTurn(){
  const cat = S.category==="Mixed" ? CATS[Math.floor(Math.random()*CATS.length)] : S.category;
  S.turn={cat,level:null,word:null,fellBack:false,orig:null,origRev:null,sPlays:S.speakerPlays,copy:null,copyFlip:null,
          gPlays:S.guesserPlays||Infinity,guess:"",correct:null,team:S.turnTeam,entry:""};
  S.micError="";
}
function afterBet(){
  if(S.source==="opponent") go("opp","whoosh");
  else { const d=drawWord(S.turn.cat,pts()?S.turn.level:null); Object.assign(S.turn,d); go("handSpk","whoosh"); }
}

// Guess timer, shared by the one-phone game and online rooms. It starts when the first listen ends.
function timerHTML(deadline,secs){ const left=deadline?Math.max(0,Math.ceil((deadline-Date.now())/1000)):secs;
  return `<div class="gtime ${deadline&&left<=5?"low":""}" id="gtime" role="timer" aria-label="Seconds left">${left}s</div>`; }
function runTimer(obj,secs,alive,onUp){
  obj.deadline=Date.now()+secs*1000; let last=secs;
  const iv=setInterval(()=>{
    if(!alive()){ clearInterval(iv); return; }
    const left=Math.max(0,Math.ceil((obj.deadline-Date.now())/1000)), el=$("gtime");
    if(el){ el.textContent=left+"s"; el.classList.toggle("low",left<=5); }
    if(left!==last){ last=left; if(left<=5 && left>0){ tone(880,.05,"square",.05); buzz(10); } }
    if(left<=0){ clearInterval(iv); stopPlay(); onUp(); }
  },200);
}
// Result text for the team game, used by Share on the final screen.
function gameShareText(names,scores,history,points,rounds){
  const [A,B]=names, line=i=>`${names[i]}: ${history.filter(h=>h.team===i).map(h=>h.ok?"🟩":"🟥").join("")||"·"}`;
  const head = points ? `BackSlang · ${A} ${scores[0]} : ${scores[1]} ${B}${scores[0]===scores[1]?" · tie":` · ${scores[0]>scores[1]?A:B} wins`}`
    : `BackSlang · ${A} ${history.filter(h=>h.team===0&&h.ok).length} · ${B} ${history.filter(h=>h.team===1&&h.ok).length}`;
  return `${head}\n${line(0)}\n${line(1)}\n${location.origin}`;
}
async function shareOut(text,btn){
  try{ if(navigator.share){ await navigator.share({text}); return; } }catch(e){ return; }
  try{ await navigator.clipboard.writeText(text); if(btn){ const o=btn.textContent; btn.textContent="Copied!"; setTimeout(()=>{ if(btn.isConnected) btn.textContent=o; },1600); } }catch(e){}
}
// Pass one phone: a turn counts once its result is settled (the reveal screen is left). Casual turns
// nobody marked as got or missed are not counted.
function teamStat(t){ if(t.counted || t.correct==null || !t.word) return; t.counted=true; statWord("team",t.correct,t.cat,t.drawn?diffKey(okDiff(S.diff)):null); }
function t_hint(){ return `Category: ${S.turn.cat}${pts()?` · worth ${pointsFor(S.turn.level)}`:""}`; }
function applyScore(sign){ const t=S.turn, d=t.correct?pointsFor(t.level):-penaltyFor(t.level); S.teams[t.team].score+=sign*d; if(sign>0) t.log.d=d; }
function finish(correct){
  const t=S.turn; t.correct=correct;
  t.log={team:t.team,word:t.word,level:t.level,d:0,ok:correct,speaker:speaker(),guesser:guesser()}; S.history.push(t.log);

// ---------- Daily BackSlang: one word a day, same for everyone ----------
const D = { speed:(()=>{ try{ const v=+localStorage.getItem("bw-speed2"); return [1,0.7,0.5].includes(v)?v:0.7; }catch(e){ return 0.7; } })(), info:null, rev:null, fwd:null, err:"", loading:false, busy:false, draft:"", local:{}, listens:0, copied:false };
const DKEY="bw-daily", DSTATS="bw-daily-stats";
const dload = (k,d) => { try{ return JSON.parse(localStorage.getItem(k)) || d; }catch(e){ return d; } };
const dsave = (k,v) => { try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} };
function dstate(){ const s=dload(DKEY,null); return s && D.info && s.n===D.info.n ? s : { n:D.info?D.info.n:0, guesses:[], hints:[], misses:0, over:false, won:false, word:"", listens:0 }; }
function dstats(){ return dload(DSTATS,{ played:0, wins:0, streak:0, best:0, lastWin:0, lastPlayed:0 }); }

// Today's word and clip are downloaded in parallel, and quietly ahead of time while the home screen is
// idle, so tapping Daily usually opens straight to the puzzle.
let dailyPre=null;
function fetchDaily(){
  if(dailyPre && dailyPre.day===todayNY()) return dailyPre.p;
  const p=Promise.all([
    fetch("/api/daily",{cache:"no-store"}).then(r=>{ if(!r.ok) throw new Error("Could not load today's word."); return r.json(); }),
    fetch("/api/daily/audio").then(r=>{ if(!r.ok) throw new Error("Today's clip isn't ready yet. Try again in a minute."); return r.arrayBuffer(); })
  ]);
  dailyPre={p,day:todayNY()}; p.catch(()=>{ if(dailyPre && dailyPre.p===p) dailyPre=null; });
  return p;
}
function prefetchDaily(){ if(ONLINE_OK && !(D.info && D.rev)) fetchDaily().catch(()=>{}); }
async function openDaily(){
  S.turn = D.local; D.err="";
  const fresh = D.info && D.rev && D.info.date===todayNY();
  if(!fresh){ D.loading=true; D.rev=null; D.fwd=null; }
  go("daily","whoosh");
  if(fresh) return;
  try{
    const [info,bytes]=await fetchDaily();
    const buf=trimBuf(await decode(bytes.slice(0)));
    D.info=info; D.fwd=buf; D.rev=reverseBuf(buf);
  }catch(e){ D.err=e.message||"Something went wrong."; dailyPre=null; }
  D.loading=false; if(S.screen==="daily") render();
  if(D.rev) idle(()=>atSpeed("rev")); // prepare the slowed clip before the first tap
}
const idle = f => (window.requestIdleCallback||(g=>setTimeout(g,200)))(f);
const todayNY = () => { try{ return new Intl.DateTimeFormat("en-CA",{timeZone:"America/New_York"}).format(new Date()); }catch(e){ return ""; } };
function untilNext(){
  try{
    const p=new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",hour:"numeric",minute:"numeric",hourCycle:"h23"}).formatToParts(new Date());
    const h=+p.find(x=>x.type==="hour").value, m=+p.find(x=>x.type==="minute").value, left=24*60-(h*60+m);
    return `${Math.floor(left/60)}h ${left%60}m`;
  }catch(e){ return "tomorrow"; }
}
async function dailyGuess(text,giveup){
  const st=dstate(); if(st.over || D.busy || (!giveup && !text.trim())) return;
  D.busy=true; D.giveArmed=false; render();
  try{
    const r=await fetch("/api/daily/guess",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({n:D.info.n,guess:giveup?"":text,misses:st.misses,giveup:!!giveup})});
    if(r.status===409){ D.info=null; dailyPre=null; D.busy=false; openDaily(); return; }
    const j=await r.json();
    if(giveup && !j.over) throw new Error("old server");
    if(!giveup) st.guesses.push({ text:text.trim(), ok:j.correct, fb:j.fb });
    st.hints=j.hints||st.hints; st.misses=j.misses; st.listens=D.listens||st.listens;
    if(j.over){ st.over=true; st.won=j.correct; st.word=j.word; st.gaveUp=!!giveup;
      const s=dstats(); s.played++; if(j.correct){ s.wins++; s.streak = s.lastWin===D.info.n-1 ? s.streak+1 : 1; s.best=Math.max(s.best,s.streak); s.lastWin=D.info.n; } else s.streak=0; s.lastPlayed=D.info.n; dsave(DSTATS,s);
      statWord("daily",j.correct,D.info.cat,null);
      if(j.correct){ SFX.win(); confetti(); buzz([40,60,40]); } else { SFX.lose(); buzz(200); }
    } else { SFX.lose(); buzz(80); }
    dsave(DKEY,st); D.draft="";
  }catch(e){ D.err="Could not check that guess. Try again."; }
  D.busy=false; render();
}
function shareText(st){
  const sq = st.guesses.map(g=>g.ok?"🟩":"🟥").join("")+(st.gaveUp?"🏳️":"");
  return `BackSlang Daily #${D.info.n} ${st.won?st.guesses.length:"X"}/${D.info.maxGuesses}\n${sq}  🔁${st.listens||D.listens}\n${location.origin}`;
}

// Guess feedback shared by Daily and Free play. The tag is overall closeness (spelling), the chip colors
// are per word. The color key only lists colors that actually appear, and only when one isn't plain gray.
const HEAT=["Not close","Getting warmer","Close","Very close"];
const FBL={g:"right word, right place",y:"right word, wrong place",n:"nearly a word in it",x:"not in it"};
const fbRow = g => `<div class="fbw">${(g.fb&&g.fb.words||[{w:g.text,s:"x"}]).map(x=>`<i class="fb-${x.s}">${esc(x.w)}</i>`).join("")}</div>${g.fb?`<em class="heat h${g.fb.level}">${HEAT[g.fb.level]}</em>`:""}`;
function fbKey(list){
  const fb=list.filter(g=>g.fb); if(!fb.length) return "";
  const seen=new Set(fb.flatMap(g=>g.fb.words.map(x=>x.s)));
  const colors=["g","y","n"].some(k=>seen.has(k)) ? ["g","y","n","x"].filter(k=>seen.has(k)).map(k=>`<i class="fb-${k}">${FBL[k]}</i>`).join(" ") : "";
  return `<p class="dim legend"><span>The tag shows how close your spelling was.</span>${colors}</p>`;
}
const hintHTML = h => `<div class="hint">💡 <b>Hint:</b> ${esc(h)}</div>`;

const SPEEDS=[[1,"Normal"],[0.7,"Slow"],[0.5,"Slower"]];
const SCACHE={};
function atSpeed(which){ const base=which==="fwd"?D.fwd:D.rev; if(!base) return null; const k=which+D.speed+"|"+(D.info&&D.info.n);
  if(!SCACHE[k]) SCACHE[k]=stretchBuf(base,D.speed); return SCACHE[k]; }
function speedSeg(){ return `<div class="seg speed" id="speed" role="radiogroup" aria-label="Playback speed">${SPEEDS.map(([v,l])=>`<button type="button" role="radio" aria-checked="${v===D.speed}" data-v="${v}">${l}</button>`).join("")}</div>`; }
function bindSpeed(){ const el=$("speed"); if(!el) return; el.querySelectorAll("button").forEach(b=>b.onclick=()=>{ SFX.tap(); D.speed=+b.dataset.v; try{ localStorage.setItem("bw-speed2",D.speed); }catch(e){} render(); const s=atSpeed("rev"); if(s) play(s); }); }

// ---------- Free play: one player, endless words, AI voice ----------
const P = { cat:(()=>{ try{ return localStorage.getItem("bw-solo-cat")||"Mixed"; }catch(e){ return "Mixed"; } })(),
  diff:(()=>{ try{ return okDiff(localStorage.getItem("bw-solo-diff")||"easy"); }catch(e){ return "easy"; } })(),
  cur:null, next:null, guesses:[], hints:0, done:false, won:false, draft:"", err:"", loading:false, local:{}, solved:0, played:0, run:0 };
const SOLO_CACHE = new WeakMap();
function soloSpeed(buf){ if(!buf) return null; let m=SOLO_CACHE.get(buf); if(!m){ m={}; SOLO_CACHE.set(buf,m); } if(!m[D.speed]) m[D.speed]=stretchBuf(buf,D.speed); return m[D.speed]; }

function soloPick(){
  const cat = P.cat==="Mixed" ? CATS[Math.floor(Math.random()*CATS.length)] : P.cat;
  const d = drawWord(cat,null,P.diff);
  return { word:d.word, syl:d.syl, cat, diff:P.diff };
}
async function soloLoad(item){
  const r=await fetch("/api/say?w="+encodeURIComponent(item.word)); if(!r.ok) throw new Error("The voice didn't load. Tap Next word to try another.");
  const buf=trimBuf(await decode(await r.arrayBuffer()));
  item.fwd=buf; item.rev=reverseBuf(buf);
  soloSpeed(item.rev); // slow it down now, in the background, not on the first tap
  return item;
}
// The next word is fetched while the current one is played. Its promise is kept, so tapping Next or Skip
// while it is still downloading waits for that download instead of starting a second one.
function soloPrefetch(){ const n=soloPick(), cat=P.cat+"|"+P.diff; P.next={cat,p:soloLoad(n)}; P.next.p.catch(()=>{ if(P.next && P.next.cat===cat) P.next=null; }); }
let soloSeq=0;
async function soloNext(){
  const seq=++soloSeq;
  const pre = P.next && P.next.cat===P.cat+"|"+P.diff ? P.next.p : null; P.next=null;
  let item=null, err="";
  P.loading=true;
  // Show the loading screen only if the word is not ready within a moment, so a prefetched word appears without a flash.
  const slow=setTimeout(()=>{ if(P.loading && S.screen==="solo") render(); },120);
  try{
    if(!wordsLoaded) await wordsReady;
    if(!LEVELS && P.diff!=="normal") await levelsReady;
    item = pre ? await pre.catch(()=>null) : null;
    if(!item) item=await soloLoad(soloPick());
  }catch(e){ err=e.message; }
  clearTimeout(slow);
  if(seq!==soloSeq) return; // a newer Next/Skip/category tap took over
  P.guesses=[]; P.hints=0; P.done=false; P.won=false; P.draft=""; P.err=err; P.local={}; S.turn=P.local;
  P.loading=false; P.cur=item; if(S.screen!=="solo") return; render(); soloPrefetch();
  if(item && item.rev) setTimeout(()=>{ if(S.screen==="solo" && P.cur===item && !activeRec) play(soloSpeed(item.rev)); },250);
}
function openSolo(){ const need=!P.cur || P.done; if(need) P.loading=true; S.turn=P.local; go("solo","whoosh"); if(need) soloNext(); }

function soloFeedback(guess, answer){
  const toks=w=>w.toLowerCase().replace(/[’']/g,"").replace(/[^a-z0-9 ]+/g," ").split(/\s+/).filter(Boolean);
  const gw=toks(guess), aw=toks(answer), left=[...aw];
  const marks=gw.map((w,i)=>(aw[i]===w || aw[aw.length-gw.length+i]===w ? "g" : null));
  marks.forEach((m,i)=>{ if(m) left.splice(left.indexOf(gw[i]),1); });
  gw.forEach((w,i)=>{ if(marks[i]) return; const k=left.indexOf(w); if(k>=0){ marks[i]="y"; left.splice(k,1); return; }
    marks[i]=aw.some(a=>a.length>=4 && lev(a,w)<=(a.length>=7?2:1)) ? "n" : "x"; });
  const a=norm(answer), g=norm(guess), r1=a&&g?1-lev(a,g)/Math.max(a.length,g.length):0;
  const pts={g:2,y:1.5,n:1,x:0}, r2=aw.length?marks.reduce((t,m)=>t+pts[m],0)/(2*Math.max(aw.length,gw.length)):0, r=Math.max(r1,r2);
  const level=r>=0.75?3:r>=0.5?2:r>=0.3?1:0;
  return { words:gw.map((w,i)=>({w,s:marks[i]})), level, heat:HEAT[level] };
}
function soloHints(){
  const w=P.cur.word, words=w.split(" ");
  return [ `${P.cur.syl} syllable${P.cur.syl>1?"s":""} long`,
    `${words.length} word${words.length>1?"s":""}: ${words.map(x=>x.replace(/[a-z0-9]/gi,"_")).join("  ")}`,
    `Starts with ${words.map(x=>x[0].toUpperCase()).join(" ")}`,
    `Looks like ${words.map(x=>x.length>1?x[0].toUpperCase()+x.slice(1,-1).replace(/[a-z0-9]/gi,"_")+x.slice(-1):x.toUpperCase()).join(" ")}` ].slice(0,P.hints);
}
function soloGuess(){
  const t=P.draft.trim(); if(!t || P.done || P.loading || !P.cur) return;
  const ok=judge(t,P.cur.word);
  P.guesses.push({ text:t, ok, fb: ok?null:soloFeedback(t,P.cur.word) }); P.draft="";
  if(ok){ P.done=true; P.won=true; P.solved++; P.played++; P.run++; soloStat(true); SFX.win(); confetti(); buzz([40,60,40]); }
  else { SFX.lose(); buzz(80); }
  render();
}
function soloGiveUp(){ if(P.done || P.loading) return; P.done=true; P.won=false; P.played++; P.run=0; soloStat(false); SFX.lose(); render(); }
function soloStat(ok){ if(P.cur) statWord("solo",ok,P.cur.cat,diffKey(P.cur.diff||P.diff)); }

        clearTimeout(P.revT); P.revealArmed=false; soloGiveUp(); };

// ================= All-time stats =================
// Every finished word in every mode is counted on this phone (localStorage "bs-stats"). Counters are kept
// summable, so the copy on each phone can be backed up to the server under one stats code and added up:
// clearing the browser or moving to a new phone only needs that code. Daily keeps its own streak in
// "bw-daily-stats" as before; it is read here, never rewritten.
const STK="bs-stats", ST_OTHERS="bs-stats-others", ST_CODE="bs-code", ST_DEV="bs-dev", ST_DIRTY="bs-dirty";
const blankStats = () => ({ v:1, words:0, got:0, streak:0, best:0, at:0,
  modes:{ daily:{p:0,w:0}, solo:{p:0,w:0}, team:{g:0,p:0,w:0}, online:{g:0,p:0,w:0,sp:0,sw:0} }, cat:{}, diff:{} });
function loadStats(){
  const s=dload(STK,null);
  if(s && s.v===1) return s;
  // First run: start from the Daily results this phone already has.
  const b=blankStats(), d=dstats();
  b.modes.daily.p=d.played|0; b.modes.daily.w=d.wins|0; b.words=b.modes.daily.p; b.got=b.modes.daily.w;
  b.best=d.best|0; b.streak=d.streak|0; b.at=b.words?Date.now():0;
  dsave(STK,b); return b;
}
let ST=loadStats();
const randCode = n => { const A="BCDFGHJKLMNPQRSTVWXZ23456789", r=crypto.getRandomValues(new Uint8Array(n)); return Array.from(r,x=>A[x%A.length]).join(""); };
const stCode = () => { let c=""; try{ c=localStorage.getItem(ST_CODE)||""; }catch(e){} if(!c){ c=randCode(10); try{ localStorage.setItem(ST_CODE,c); }catch(e){} } return c; };
const stDev = () => { let d=""; try{ d=localStorage.getItem(ST_DEV)||""; }catch(e){} if(!d){ d=randCode(12); try{ localStorage.setItem(ST_DEV,d); }catch(e){} } return d; };
const fmtCode = c => c.slice(0,5)+"-"+c.slice(5);
const DIFF_LABEL = Object.fromEntries(DIFFS);
// Difficulty of a word drawn from the list. Words a player typed in, and Daily words, have none and
// are left out of the difficulty breakdown.
const diffKey = d => typeof d==="string" && DIFF_LABEL[d] ? d : null;
const bump = (o,k,ok) => { const r=o[k]||(o[k]={p:0,w:0}); r.p++; if(ok) r.w++; };
// One finished word that this player guessed (or tried to).
function statWord(mode,ok,cat,diff){
  ok=!!ok; ST.words++; if(ok) ST.got++;
  ST.streak = ok ? ST.streak+1 : 0; ST.best=Math.max(ST.best,ST.streak);
  bump(ST.modes,mode,ok); if(cat) bump(ST.cat,cat,ok); if(diff) bump(ST.diff,diff,ok);
  statSave();
}
function statGame(mode){ ST.modes[mode].g=(ST.modes[mode].g|0)+1; statSave(); }
function statSpoke(ok){ const m=ST.modes.online; m.sp++; if(ok) m.sw++; statSave(); }
function statSave(){ ST.at=Date.now(); dsave(STK,ST); try{ localStorage.setItem(ST_DIRTY,"1"); }catch(e){} statPushSoon(); }

// ---- backup: each phone stores its own copy under the shared code; the server never adds anything up ----
let stPushT=0, stSync={ state:"", err:"", draft:"" };
function statPushSoon(){ clearTimeout(stPushT); stPushT=setTimeout(statPush,1500); }
async function statPush(){
  if(!ONLINE_OK) return;
  let dirty=false; try{ dirty=localStorage.getItem(ST_DIRTY)==="1"; }catch(e){}
  if(!dirty || !ST.words && !ST.modes.online.sp) return;
  try{
    const r=await fetch(`/api/stats/${stCode()}?dev=${stDev()}`,{method:"PUT",keepalive:true,headers:{"content-type":"application/json"},body:JSON.stringify(ST)});
    if(r.ok){ try{ localStorage.removeItem(ST_DIRTY); }catch(e){} stSync.state="saved"; }
  }catch(e){}
}
async function statPull(code){
  const r=await fetch(`/api/stats/${code}`,{cache:"no-store"}); if(!r.ok) throw new Error(r.status===404?"none":"net");
  const j=await r.json(), dev=stDev(), others={};
  for(const [k,v] of Object.entries(j.devices||{})) if(k!==dev && v && v.v===1) others[k]=v;
  return { others, any:Object.keys(j.devices||{}).length>0 };
}
async function statRefresh(){
  if(!ONLINE_OK) return;
  try{ const {others}=await statPull(stCode()), was=JSON.stringify(dload(ST_OTHERS,{}));
    dsave(ST_OTHERS,others); if(S.screen==="stats" && JSON.stringify(others)!==was) render(); }catch(e){}
}
async function statRestore(raw){
  const code=raw.toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(code.length!==10){ stSync.err="Stats codes are 10 letters and numbers."; render(); return; }
  if(code===stCode()){ stSync.err="That's already this phone's code."; render(); return; }
  stSync.state="restoring"; stSync.err=""; render();
  try{
    const {others,any}=await statPull(code);
    if(!any){ stSync.err="No stats saved under that code."; stSync.state=""; render(); return; }
    // This phone joins that code: its own counts are kept and added to the restored ones.
    try{ localStorage.setItem(ST_CODE,code); localStorage.setItem(ST_DIRTY,"1"); }catch(e){}
    dsave(ST_OTHERS,others); stSync.state="restored"; stSync.draft=""; statPush();
  }catch(e){ stSync.err=e.message==="none"?"No stats saved under that code.":"Couldn't reach the server. Try again."; stSync.state=""; }
  render();
}
// This phone plus every other phone on the same code. Counts add up; the best streak is the highest,
// and the current streak comes from whichever phone played last.
function statsAll(){
  const list=[ST,...Object.values(dload(ST_OTHERS,{}))].filter(x=>x&&x.v===1);
  const add=(a,b)=>{ for(const [k,v] of Object.entries(b||{})){ if(v && typeof v==="object") add(a[k]||(a[k]={}),v); else if(typeof v==="number") a[k]=(a[k]||0)+(v>0?v:0); } return a; };
  const out=blankStats(); list.forEach(s=>{ add(out.modes,s.modes); add(out.cat,s.cat); add(out.diff,s.diff); out.words+=s.words|0; out.got+=s.got|0; });
  const last=list.reduce((a,s)=>(s.at||0)>(a.at||0)?s:a,list[0]);
  out.streak=last.streak|0; out.best=Math.max(...list.map(s=>s.best|0)); out.phones=list.length;
  return out;
}
const pct = (w,p) => p ? Math.round(100*w/p)+"%" : "–";

VIEWS.stats = function(){
  const A=statsAll(), M=A.modes, d=dstats(), code=stCode();
  const bars = (obj,label) => Object.entries(obj).filter(([,r])=>r.p).sort((x,y)=>y[1].p-x[1].p).map(([k,r])=>

  const diffOrder = Object.fromEntries(DIFFS.map(([k])=>k).filter(k=>A.diff[k]&&A.diff[k].p).map(k=>[k,A.diff[k]]));
  const mode = (name,n,line) => `<div class="mrow"><b>${name}</b><span>${n?line:"Not played yet"}</span></div>`;
  const cats=bars(A.cat), diffs=Object.keys(diffOrder).length?bars(diffOrder,k=>DIFF_LABEL[k]):"";
  const empty=!A.words && !M.online.sp && !M.team.g && !M.online.g;
  return { key:"s", html:`<h2 class="big-t">Your stats</h2>
    ${empty?`<p class="dim">Nothing yet. Play any mode and every word you guess is counted here.</p>`:""}
    <div class="dstats"><div><b>${A.words}</b>Words played</div><div><b>${A.got}</b>Guessed</div><div><b>${pct(A.got,A.words)}</b>Accuracy</div><div><b>${A.best}</b>Best streak</div></div>

    <div class="card stcard"><span class="lbl">By mode</span>
      ${mode("Daily",M.daily.p,`${M.daily.w} of ${M.daily.p} won · ${d.streak} day streak · best ${d.best}`)}
      ${mode("Free play",M.solo.p,`${M.solo.w} of ${M.solo.p} guessed · ${pct(M.solo.w,M.solo.p)}`)}
      ${mode("Pass one phone",M.team.g+M.team.p,`${M.team.g} game${M.team.g===1?"":"s"} · ${M.team.w} of ${M.team.p} words guessed`)}
      ${mode("Online",M.online.g+M.online.p+M.online.sp,`${M.online.g} game${M.online.g===1?"":"s"} · guessed ${M.online.w} of ${M.online.p} · your words got across ${M.online.sw} of ${M.online.sp}`)}</div>
    ${cats?`<div class="card stcard"><span class="lbl">By category</span>${cats}</div>`:""}
    ${diffs?`<div class="card stcard"><span class="lbl">By difficulty</span>${diffs}</div>`:""}
    ${ONLINE_OK?`<div class="card stcard"><span class="lbl">Keep your stats</span>
      <p style="margin:0">Your stats code is <b class="scode">${fmtCode(code)}</b>. Enter it on a new phone, or after clearing your browser, to bring your stats back.${A.phones>1?` It covers ${A.phones} phones.`:""}</p>
      <button class="btn ghost" id="copyCode">${stSync.copied?"Copied":"Copy code"}</button>
      <div class="row" style="gap:8px"><input class="inp sm" id="rcode" maxlength="11" autocomplete="off" autocapitalize="characters" placeholder="Enter a code" value="${esc(stSync.draft)}" style="text-transform:uppercase"><button class="btn team" id="restore" style="flex:0 0 34%" ${stSync.state==="restoring"?"disabled":""}>${stSync.state==="restoring"?"…":"RESTORE"}</button></div>
      ${stSync.err?`<p class="err" style="margin:0">${esc(stSync.err)}</p>`:stSync.state==="restored"?`<p class="dim" style="margin:0">Restored. This phone's stats are now added to that code.</p>`:""}</div>`:""}
    <button class="link" id="home">Back to menu</button>`,
    bind(){
      $("home").onclick=()=>go("title");
      if(!ONLINE_OK) return;
      $("copyCode").onclick=async()=>{ try{ await navigator.clipboard.writeText(fmtCode(code)); stSync.copied=true; render(); setTimeout(()=>{ stSync.copied=false; if(S.screen==="stats") render(); },1600); }catch(e){} };
      const i=$("rcode"); i.oninput=()=>stSync.draft=i.value; i.onkeydown=e=>{ if(e.key==="Enter") $("restore").click(); };
      $("restore").onclick=()=>{ if(!i.value.trim()){ i.focus(); return; } statRestore(i.value); };
    } };
};
function openStats(){ stSync.err=""; if(stSync.state!=="restoring") stSync.state=""; go("stats","whoosh"); statPush(); statRefresh(); }

const O = { ws:null, st:null, code:"", pid:"", name:"", err:"", clips:{}, local:{}, lastReveal:0, retry:0, closed:false, pickDraft:"", guessDraft:"" };
try{ O.pid = localStorage.getItem("rvg-pid") || ""; O.name = localStorage.getItem("rvg-name") || ""; }catch(e){}
if(!O.pid){ O.pid = Math.random().toString(36).slice(2,12)+Date.now().toString(36); try{ localStorage.setItem("rvg-pid",O.pid); }catch(e){} }
const ONLINE_OK = location.protocol.startsWith("http") && !/claudeusercontent|claude\.ai/.test(location.hostname);

const ost = () => O.st;
const oturn = () => O.st && O.st.turn;
const oname = id => (O.st && O.st.players[id] && O.st.players[id].name) || "Someone";
const omyTeam = () => O.st && O.st.players[O.pid] ? O.st.players[O.pid].team : 0;
const opts = () => O.st && O.st.settings.mode === "points";
const send = m => { try{ O.ws && O.ws.readyState===1 && O.ws.send(JSON.stringify(m)); }catch(e){} };
function onlineTeamColor(){
  const s=O.st; if(!s) return 0;
  if(["lobby"].includes(s.phase)) return omyTeam();
  if(s.phase==="pick") return 1-s.turn.team;
  if(s.turn) return s.turn.team;
  return omyTeam();
}
function newCode(){ const A="BCDFGHJKLMNPQRSTVWXZ"; let c=""; for(let i=0;i<4;i++) c+=A[Math.floor(Math.random()*A.length)]; return c; }

function connect(code){
  O.code = code; O.closed=false; O.err="";
  try{ history.replaceState(history.state,"","?room="+code); }catch(e){}
  const ws = new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/api/room/"+code+"/ws?pid="+encodeURIComponent(O.pid));
  O.ws = ws;
  ws.onopen = ()=>{ if(ws!==O.ws) return; O.retry=0; send({type:"hello", name:O.name}); };
  ws.onmessage = ev => {
    if(ws!==O.ws) return;
    let m; try{ m=JSON.parse(ev.data); }catch(e){ return; }
    if(m.type==="state"){ const prev=O.st; O.st=m.state; onState(prev); }
    else if(m.type==="play"){ if(O.selfPlay && Date.now()-O.selfPlay<8000){ O.selfPlay=0; } else playGuesserClip(); }
    else if(m.type==="error"){ O.err=m.message; orender(); }
  };
  ws.onclose = ()=>{ if(O.closed || ws!==O.ws) return; O.retry++; clearTimeout(O.rt); O.rt=setTimeout(()=>{ if(!O.closed && ws===O.ws) connect(O.code); }, Math.min(5000, 500*O.retry)); };
}
function leaveRoom(){ O.closed=true; clearTimeout(O.rt); try{ O.ws && O.ws.close(); }catch(e){} O.ws=null; O.code=""; O.st=null; O.clips={}; O.local={}; try{ history.replaceState(history.state,"",location.pathname); }catch(e){} }

// One download and decode per clip version: the background prefetch and a tap share the same promise.
function getClip(kind){
  const key=kind+":"+O.st.clipVer;
  if(!O.clips[key]) O.clips[key]=(async()=>{
    const r = await fetch("/api/room/"+O.code+"/clip/"+kind,{cache:"no-store"});
    if(!r.ok) throw new Error("clip "+r.status);
    const buf = trimBuf(await cleanBuf(await decode(await r.arrayBuffer())));
    return {buf, rev:reverseBuf(buf)};
  })().catch(e=>{ delete O.clips[key]; throw e; });
  return O.clips[key];
}
async function upload(kind, blob){
  const r = await fetch("/api/room/"+O.code+"/clip/"+kind+"?pid="+encodeURIComponent(O.pid),{method:"PUT",body:blob,headers:{"Content-Type":blob.type||"audio/webm"}});
  if(!r.ok) throw new Error("Upload failed ("+r.status+")");
}
async function playGuesserClip(){
  try{ const c=await getClip("copy"), L=O.local; SFX.tap();
    play(c.rev,()=>{ const s=O.st, t=s&&s.turn, secs=s&&s.settings.timer;
      if(secs && t && t.guesserId===O.pid && s.phase==="guess" && !L.deadline)
        runTimer(L,secs,()=>S.screen==="online" && O.local===L && O.st && O.st.phase==="guess",()=>{
          if(opts()){ if(O.guessDraft.trim()) send({type:"guess",text:O.guessDraft}); else send({type:"giveup"}); } else send({type:"reveal"}); });
      orender(); });
    const b=$("pl"); if(b){ b.classList.add("spin"); b.disabled=true; } }
  catch(e){ O.err="Couldn't load the clip. Check your connection."; orender(); }
}

// Re-render without cutting off audio or a recording in progress, and keep typing focus.
function orender(){
  if(S.screen!=="online") return;
  if(activeRec) return; // the recording's own callback re-renders when it stops
  const f=document.activeElement, fid=f&&f.id, sel=f&&f.selectionStart;
  KEEP_AUDIO=true; render(); KEEP_AUDIO=false;
  if(fid){ const el=$(fid); if(el && el.tagName==="INPUT"){ el.focus(); try{ el.setSelectionRange(sel,sel); }catch(e){} } }
}
function onState(prev){
  const s=O.st, t=s.turn;
  // new turn: clear local recordings
  if(!prev || !prev.turn || !t || prev.turn.n!==t.n){ O.local={}; O.clips={}; O.pickDraft=""; O.guessDraft=""; }
  if(prev && prev.phase!==s.phase){
    if(s.phase==="bet"||s.phase==="pick") SFX.slam();
    if(s.phase==="speak"||s.phase==="guess") SFX.whoosh();
    if(s.phase==="guess" && t.guesserId===O.pid) buzz([40,40,40]);
    if(s.phase==="final"){ SFX.fanfare(); setTimeout(()=>confetti(220),200); }
  }
  // Stats: a turn counts for this player when the room moves on from its reveal (so a re-marked result is final).
  if(prev && prev.phase==="reveal" && prev.turn && (s.phase!=="reveal" || !t || t.n!==prev.turn.n)){
    const pt=prev.turn, dk=pt.drawn?diffKey(okDiff(prev.settings&&prev.settings.difficulty)):null;
    if(pt.correct!=null && pt.word){ if(pt.guesserId===O.pid) statWord("online",pt.correct,pt.cat,dk); else if(pt.speakerId===O.pid) statSpoke(pt.correct); }
  }
  if(prev && prev.phase!=="final" && s.phase==="final" && s.players[O.pid]) statGame("online");
  if(s.phase==="reveal" && t && O.lastReveal!==t.n && prev){
    O.lastReveal=t.n; SFX.slam();
    if(s.settings.mode==="points"){ if(t.correct){ setTimeout(()=>{SFX.win();confetti();buzz(60);},150); } else setTimeout(()=>{SFX.lose();buzz([80,60,80]);},150); }
  }
  if(s.phase==="guess" && t.guesserId===O.pid) getClip("copy").catch(()=>{});
  if(s.phase==="reveal") { getClip("orig").catch(()=>{}); getClip("copy").catch(()=>{}); }
  orender();
}

        <span class="kicker">Room code</span><div class="code">${esc(O.code)}</div>
        <button class="btn ghost" id="share" style="width:auto;padding:10px 18px;font-size:1rem">📲 Invite players</button></div>
      <div class="card"><div class="teamrow">${col(0)}${col(1)}</div></div>
      ${host?`<div class="card">
        <span class="lbl">Mode</span>${seg("mode",[["points","🏆 Points"],["casual","🎉 Casual"]],st.mode)}
        <span class="lbl">Who picks the word</span>${seg("source",[["opponent","Other team"],["random","Random"]],st.source)}
        <span class="lbl">Category</span>${seg("cat",cats.map(c=>[c,c]),st.category)}
        <span class="lbl">Difficulty</span>${seg("diff",DIFFS,okDiff(st.difficulty))}
        <span class="lbl">Guesser hears the clip</span>${seg("gp",[[1,"1×"],[2,"2×"],[0,"∞"]],st.guesserPlays)}
        <span class="lbl">Guess timer</span>${seg("timer",[[0,"Off"],[30,"30 sec"],[60,"60 sec"]],st.timer||0)}
        ${st.mode==="points"?`<span class="lbl">Rounds</span>${seg("rounds",[[2,"2"],[4,"4"],[6,"6"],[8,"8"]],st.rounds)}`:""}</div>
        ${errHTML()}<button class="btn" id="start" ${ready?"":"disabled"}>${ready?"START GAME":"NEED 2 PER TEAM"}</button>`
      :`<div class="card center"><p class="dim">${esc(oname(s.hostId))} is setting up: ${st.mode==="points"?"Points":"Casual"} · ${esc(st.category)} · ${esc(DIFFS.find(([v])=>v===okDiff(st.difficulty))[1])} · ${st.source==="opponent"?"other team picks":"random words"}${st.timer?` · ${st.timer} sec timer`:""}</p></div>${waitCard("Waiting for the host","")}`}`,
      bind(){
        document.querySelectorAll("[data-team]").forEach(b=>b.onclick=()=>{ SFX.tap(); send({type:"team",team:+b.dataset.team}); });
        $("share").onclick=async()=>{ try{ if(navigator.share){ await navigator.share({title:"BackSlang",text:"Join my game. Room code "+O.code,url:link}); return; } }catch(e){ return; }
          try{ await navigator.clipboard.writeText(link); $("share").textContent="Link copied"; }catch(e){ $("share").textContent=link; } };
        if(host){
          const set=x=>send({type:"settings",settings:Object.assign({},st,x)});
          const segb=(id,fn)=>$(id)&&$(id).querySelectorAll("button").forEach(b=>b.onclick=()=>{ SFX.tap(); fn(b.dataset.v); });
          segb("mode",v=>set({mode:v})); segb("source",v=>set({source:v})); segb("cat",v=>set({category:v})); segb("diff",v=>set({difficulty:v})); segb("gp",v=>set({guesserPlays:+v})); segb("rounds",v=>set({rounds:+v})); segb("timer",v=>set({timer:+v}));
          $("start").onclick=()=>{ ac(); SFX.go(); keepAwake(true); send({type:"start"}); };
        }
      } };
  },
  bet(){
    const s=O.st, t=s.turn;
    if(t.speakerId!==O.pid) return { cls:"center", html: waitCard(`${esc(oname(t.speakerId))} is placing a bet`, `${esc(s.teamNames[t.team])} team · ${esc(t.cat)}`, t.speakerId) };
    const hues=["#eea774","#ec9963","#ea8b52","#e87e41","#e5712d","#cf601e"];
    return { cls:"center", html:`<span class="kicker">You're the Speaker · ${esc(t.cat)}</span><h2 class="big-t">How big are you going?</h2>
      <div class="bets">${[1,2,3,4,5,6].map((n,i)=>`<button class="bet" data-l="${n}" style="background:${hues[i]};animation-delay:${i*50}ms"><span class="n">${n}</span><span class="s">SYLLABLES</span><span class="p">+${pointsFor(n)}</span><span class="m">miss −${penaltyFor(n)}</span></button>`).join("")}</div>`,
      bind(){ document.querySelectorAll(".bet").forEach(b=>b.onclick=()=>{ SFX.coin(); buzz(15); send({type:"bet",level:+b.dataset.l}); }); } };
  },
  pick(){
    const s=O.st, t=s.turn, mine=omyTeam()!==t.team, n=O.pickDraft.trim()?estSyl(O.pickDraft):0;
    if(!mine) return { cls:"center", html: waitCard(`${esc(s.teamNames[1-t.team])} is picking your word`, `${esc(t.cat)}${opts()?` · ${t.level} syllables`:""}`) };
    return { cls:"center", html:`<div class="splash" style="padding:22px 18px"><span class="kicker" style="color:#fff">Your team picks</span>
      <h1 class="big-t">Give ${esc(oname(t.speakerId))} a word</h1><p>A ${esc(single(t.cat))}${opts()?` with <b>${t.level} syllables</b>`:""}. ${esc(oname(t.guesserId))} has to guess it.</p></div>
      <input class="inp" id="entry" autocomplete="off" autocapitalize="off" placeholder="Type it" value="${esc(O.pickDraft)}">
      <div class="sylls" id="est">${n?Array.from({length:n},()=>"<i></i>").join("")+`<span class="dim" style="margin-left:6px">≈${n}${opts()&&n!==t.level?` (needs ${t.level})`:""}</span>`:""}</div>
      <button class="btn" id="lock" ${O.pickDraft.trim()?"":"disabled"}>SEND IT</button>
      <button class="btn ghost" id="rand">🎲 Surprise them</button>`,
      bind(){
        const e=$("entry"), l=$("lock");
        e.oninput=()=>{ O.pickDraft=e.value; l.disabled=!e.value.trim(); const k=e.value.trim()?estSyl(e.value):0;
          $("est").innerHTML=k?Array.from({length:k},()=>"<i></i>").join("")+`<span class="dim" style="margin-left:6px">≈${k}${opts()&&k!==t.level?` (needs ${t.level})`:""}</span>`:""; };
        e.onkeydown=ev=>{ if(ev.key==="Enter" && e.value.trim()) l.click(); };
        l.onclick=()=>{ SFX.slam(); send({type:"pick",word:O.pickDraft}); };
        $("rand").onclick=()=>{ SFX.slam(); send({type:"pick",random:true}); };
      } };
  },
  speak(){
    const s=O.st, t=s.turn;
    if(t.speakerId!==O.pid){
      const sub = t.word ? `The word: <b>${esc(t.word)}</b>` : `${esc(oname(t.guesserId))}, get ready to guess.`;
      const what = !t.clips.orig ? "is saying the word" : !t.clips.copy ? "is saying it backward" : "is about to send it";
      return { cls:"center", html: waitCard(`${esc(oname(t.speakerId))} ${what}`, sub, t.speakerId) };
    }
    S.turn = O.local;
    const L=O.local;
    // Stage 1: say it
    if(!t.clips.orig) return { cls:"center", html:`<span class="kicker">You're the Speaker · say it normally</span>
      <div class="word">${esc(t.word)}</div>
      ${opts()?`<div class="sylls">${"<i></i>".repeat(t.level)}</div>`:`<span class="chip">${esc(t.cat)}</span>`}
      ${t.drawn?`<button class="btn ghost" id="shuffle" style="width:auto;padding:10px 18px">🔀 Shuffle</button>`:""}
      ${micHTML(L.uploading?"Sending…":"Tap to record",false)}${errHTML()}`,
      bind(){
        if(t.drawn) $("shuffle").onclick=()=>{ SFX.whoosh(); buzz(15); send({type:"shuffle"}); };
        const m=$("mic"); m.onclick=()=>recordInto("orig",m,async(buf,blob)=>{ L.origRev=reverseBuf(buf); L.uploading=true; orender();
          try{ await upload("orig",blob); O.err=""; SFX.rewind(); }catch(e){ O.err=e.message; } L.uploading=false; orender(); });
      } };
    // Stage 2: hear it backward (unlimited) and record the backward copy on one screen
    if(!L.origRev){ getClip("orig").then(c=>{ L.origRev=c.rev; orender(); }).catch(()=>{}); return { cls:"center", html: waitCard("Loading your clip…","") }; }
    const done=t.clips.copy;
    return { cls:"center", html:`<span class="kicker">You're the Speaker · now say it BACKWARD</span>
      <div class="word sm">${esc(t.word)}</div>
      <div class="lrow"><button class="play sm ${playing&&playing.buffer===L.origRev?"spin":""}" id="pl" aria-label="Play backward">${ICON.rew}</button><p class="dim">Tap to hear it backward. Listen as many times as you want.</p></div>
      ${micHTML(L.uploading?"Sending…":done?"Recorded! Tap to redo":"Tap to record your backward version",done)}
      ${done&&L.copy?`<button class="btn ghost" id="mine">▶ Hear my take</button>`:""}
      ${done?`<button class="btn team" id="send">SEND TO ${esc(oname(t.guesserId).toUpperCase())}</button>`:""}
      <button class="link" id="redo">Redo the normal recording</button>${errHTML()}`,
      bind(){
        const p=$("pl"); p.onclick=()=>{ if(activeRec) return; buzz(15); p.classList.add("spin"); play(L.origRev,()=>{ const q=$("pl"); if(q) q.classList.remove("spin"); }); };
        if(!L.autoRev && !done){ L.autoRev=true; setTimeout(()=>{ const q=$("pl"); if(S.screen==="online" && O.local===L && q && !activeRec && !playing) q.click(); },650); }
        const m=$("mic"); m.onclick=()=>{ if(done && !activeRec) m.classList.remove("done");
          recordInto("copy",m,async(buf,blob)=>{ L.uploading=true; orender(); try{ await upload("copy",blob); O.err=""; }catch(e){ O.err=e.message; } L.uploading=false; orender(); }); };
        if(done && L.copy) $("mine").onclick=()=>{ if(activeRec) return; buzz(10); play(L.copy); };
        if(done) $("send").onclick=()=>{ SFX.go(); send({type:"send"}); };
        $("redo").onclick=()=>{ L.origRev=null; L.copy=null; L.autoRev=false; send({type:"redoOrig"}); };
      } };
  },
  guess(){
    const s=O.st, t=s.turn, lim=s.settings.guesserPlays, left=t.gPlays;
    if(t.guesserId!==O.pid){
      const sub = t.word ? `The word: <b>${esc(t.word)}</b>${t.guess?"":""}` : "Can you figure it out before they do?";
      return { cls:"center", html: waitCard(`${esc(oname(t.guesserId))} is guessing`, sub, t.guesserId) };
    }
    return { cls:"center", html:`<span class="kicker">You're the Guesser · ${esc(t.cat)}${opts()?` · ${t.level} syllables`:""}</span><h2 class="big-t">What did ${esc(oname(t.speakerId))} say?</h2>
      <button class="play ${playing?"spin":""}" id="pl" ${(!lim||left)&&!playing?"":"disabled"} aria-label="Play clip">${ICON.play}</button>
      ${lim?`<div class="pips">${Array.from({length:lim},(_,i)=>`<i class="${i<lim-left?"used":""}"></i>`).join("")}</div><p class="dim">${left} listen${left===1?"":"s"} left</p>`:`<p class="dim">Listen as much as you want</p>`}
      ${s.settings.timer?timerHTML(O.local.deadline,s.settings.timer):""}
      ${opts()?`<input class="inp" id="guess" autocomplete="off" autocapitalize="off" placeholder="Your guess" value="${esc(O.guessDraft)}" ${t.heard?"":"disabled"}>
        <button class="btn team" id="submit" ${t.heard?"":"disabled"}>FINAL ANSWER</button><button class="link" id="giveup" ${t.heard?"":"hidden"}>Give up</button>`
      :`<button class="btn team" id="reveal" ${t.heard?"":"disabled"}>REVEAL IT</button>`}${errHTML()}`,
      bind(){
        // Start the clip on the tap itself instead of waiting for the server's go-ahead; the server still counts the listen.
        $("pl").onclick=()=>{ ac(); if(playing || (lim && left<=0)) return; O.selfPlay=Date.now(); send({type:"listen"}); playGuesserClip(); };
        if(opts()){
          const g=$("guess"); g.oninput=()=>O.guessDraft=g.value; g.onkeydown=e=>{ if(e.key==="Enter") $("submit").click(); };
          $("submit").onclick=()=>{ if(!O.guessDraft.trim()){ g.focus(); return; } SFX.drum(); send({type:"guess",text:O.guessDraft}); };
          $("giveup").onclick=()=>send({type:"giveup"});
        } else $("reveal").onclick=()=>send({type:"reveal"});
      } };
  },
  reveal(){
    const s=O.st, t=s.turn, pts_=opts(), ok=t.correct, d=t.delta, last=pts_ && s.round>s.settings.rounds;
    return { cls:"center"+(pts_&&!ok?" shake":""), html:`
      ${pts_?`<div class="stamp ${ok?"good":"bad"}">${ok?"NAILED IT":t.guess?"NOPE":"GAVE UP"}</div>`:""}
      <div class="word">${esc(t.word)}</div>
      ${pts_&&t.guess?`<p class="dim">${esc(oname(t.guesserId))} guessed “${esc(t.guess)}”</p>`:""}
      ${pts_?`<div class="delta ${ok?"good":"bad"}">${d>0?"+":"−"}${Math.abs(d)} <span style="font-size:1.1rem">${esc(s.teamNames[t.team])}</span></div>`
        :`<div class="row" style="width:100%"><button class="btn ghost" id="gotIt">${t.correct===true?"✅ ":""}Got it</button><button class="btn ghost" id="missed">${t.correct===false?"❌ ":""}Missed</button></div>`}
      <div class="card" style="width:100%;box-sizing:border-box"><span class="lbl">Hear the whole chain</span><div class="chain">
        <button class="btn ghost" id="c1">1 · Original</button><button class="btn ghost" id="c2">2 · Backward</button>
        <button class="btn ghost" id="c3">3 · Backward copy</button><button class="btn ghost" id="c4">4 · What ${esc(oname(t.guesserId))} heard</button></div>
        ${pts_?`<button class="link" id="flip">${ok?"That's wrong, mark it a miss":"Close enough? Count it"}</button>`:""}</div>
      <button class="btn" id="next">${last?"FINAL SCORES":"NEXT TURN"}</button>${!pts_?`<button class="link" id="end">End game</button>`:""}`,
      bind(){
        const pc=(k,rev)=>async()=>{ try{ const c=await getClip(k); play(rev?c.rev:c.buf); }catch(e){ O.err="Couldn't load that clip."; orender(); } };
        $("c1").onclick=pc("orig",false); $("c2").onclick=pc("orig",true); $("c3").onclick=pc("copy",false); $("c4").onclick=pc("copy",true);
        if(pts_) $("flip").onclick=()=>send({type:"mark",correct:!ok});
        else { $("gotIt").onclick=()=>{ SFX.win(); confetti(80); send({type:"mark",correct:true}); }; $("missed").onclick=()=>{ SFX.lose(); send({type:"mark",correct:false}); }; $("end").onclick=()=>send({type:"end"}); }
        $("next").onclick=()=>{ SFX.tap(); send({type:"next"}); };
      } };
  },
  final(){
    const s=O.st, [A,B]=s.scores, tie=A===B, wi=A>B?0:1, pts_=opts(), host=s.hostId===O.pid;
    const tally=i=>s.history.filter(h=>h.team===i && h.ok).length;
    return { cls:"center", html:`<div class="splash"><div style="font-size:4rem;line-height:1">🏆</div>
      <h1 class="huge">${pts_?(tie?"IT'S A TIE":esc(s.teamNames[wi])+" WINS"):"GG!"}</h1>
      <p class="d" style="font-size:1.6rem">${pts_?`${A} : ${B}`:`${esc(s.teamNames[0])} ${tally(0)} · ${esc(s.teamNames[1])} ${tally(1)}`}</p></div>
      ${host?`<button class="btn" id="again">REMATCH</button><button class="btn ghost" id="lobby">Back to lobby</button>`:`<p class="dim">Waiting for ${esc(oname(s.hostId))} to start a rematch</p>`}
      <button class="btn ghost" id="shareG">📤 Share result</button>
      <div class="card" style="width:100%;box-sizing:border-box;text-align:left"><span class="lbl">Every turn</span>
      ${s.history.map(h=>`<p>${esc(s.teamNames[h.team])} · <b>${esc(h.word)}</b> <span class="dim">${esc(h.speaker||"")} → ${esc(h.guesser||"")}</span> ${pts_?`<span style="color:${h.d>0?"var(--good)":"var(--bad)"}">${h.d>0?"+":"−"}${Math.abs(h.d)}</span>`:(h.ok===true?"✅":h.ok===false?"❌":"")}</p>`).join("")||`<p class="dim">No turns played.</p>`}</div>`,
      bind(){ if(host){ $("again").onclick=()=>send({type:"start"}); $("lobby").onclick=()=>send({type:"lobby"}); }
        $("shareG").onclick=()=>shareOut(gameShareText(s.teamNames,s.scores,s.history,pts_,s.settings.rounds),$("shareG")); } };
  }
};

// Auto-open the join screen from an invite link
{ const rc=(new URLSearchParams(location.search).get("room")||"").toUpperCase();
  if(rc && ONLINE_OK){ S.screen="online"; if(/^[A-Z]{4}$/.test(rc) && O.name) connect(rc); } }
loadWords();
render();
// First visit: a short how-to-play walkthrough (not when arriving from a room invite).
try{ if(S.screen==="title" && !localStorage.getItem("bs-toured")) openMenu("tour"); }catch(e){}
// After the first paint, when the phone is idle: warm up today's Daily so it opens instantly.
addEventListener("load",()=>setTimeout(()=>idle(()=>{ prefetchDaily(); statPush(); }),800));
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){
    // In the background: stop any recording. The mic stays open (the phone pauses it on its own),
    // because Chrome and in-app browsers on iPhone ask for access again on every new request.
    stopRec(); if(unlockEl) try{ unlockEl.pause(); }catch(e){}
    clearTimeout(stPushT); statPush(); // save the latest stats before the phone suspends the page
  } else {
    if(actx) ac();
    if(wakeWanted && !["title","setup","daily","solo","stats"].includes(S.screen)) keepAwake(true);
    // Phones drop sockets in the background. Reconnect right away instead of waiting out the retry delay.
    if(S.screen==="online" && O.code && !O.closed && (!O.ws || O.ws.readyState>1)){ clearTimeout(O.rt); O.retry=0; connect(O.code); }
    if(S.screen==="title") prefetchDaily();
  }
});

</script>
<script>if("serviceWorker" in navigator) addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
</body></html>
