<title>Reverse Voice Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: phone-first arcade stage. A thin score bar on top, one big action per screen, centered. Single dark game-show look by design. */
:root{
  --bg:#160d3b; --bg2:#22145c; --card:#2d1f73; --ink:#ffffff; --dim:#b8afe8; --line:#3d2d8c;
  --a:#ff4f6d; --a-dk:#a8183a; --b:#2fc2ff; --b-dk:#0b6f9e;
  --gold:#ffd23f; --gold-dk:#b88a00; --good:#3fe08a; --good-dk:#108a4a; --bad:#ff4545;
  --paper:#fff7e6; --paper-ink:#1d1145;
  --team:var(--a); --team-dk:var(--a-dk);
  --f-d:"Lilita One","Arial Black",Impact,system-ui,sans-serif;
  --f-b:"Nunito",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
body[data-team="1"]{--team:var(--b);--team-dk:var(--b-dk)}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 70% at 50% -10%, color-mix(in srgb,var(--team) 38%,transparent) 0%, transparent 60%), var(--bg);
  background-attachment:fixed;color:var(--ink);font-family:var(--f-b);font-weight:800;font-size:17px;line-height:1.35;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 24px;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;transition:background .4s}
input{user-select:text;-webkit-user-select:text}
.wrap{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
h1,h2,.d{font-family:var(--f-d);font-weight:400;margin:0;letter-spacing:.01em;text-wrap:balance}
p{margin:0}
.dim{color:var(--dim)}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0 10px}
.logo{font-family:var(--f-d);font-size:1.05rem;display:flex;gap:6px;align-items:center}
.logo .flip{display:inline-block;transform:scaleX(-1);color:var(--gold)}
.scores{display:flex;align-items:center;gap:6px;font-family:var(--f-d);font-size:1.15rem;font-variant-numeric:tabular-nums}
.scores .s{padding:3px 10px;border-radius:999px;min-width:2.4em;text-align:center}
.scores .sa{background:var(--a)} .scores .sb{background:var(--b);color:#05253a}
.scores .on{box-shadow:0 0 0 3px #fff}
.iconbtn{width:40px;height:40px;border-radius:12px;border:none;background:var(--card);color:var(--ink);font-size:1.2rem;cursor:pointer;display:grid;place-items:center}

.stage{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;padding-block:8px;animation:enter .38s cubic-bezier(.2,1.4,.4,1)}
@keyframes enter{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
.center{text-align:center;align-items:center}
.kicker{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:900}
.huge{font-size:clamp(2.6rem,13vw,4rem);line-height:.95}
.big-t{font-size:clamp(1.9rem,9vw,2.6rem);line-height:1}

/* buttons: arcade 3D */
.btn{font-family:var(--f-d);font-size:1.45rem;border:none;border-radius:20px;padding:18px 20px;cursor:pointer;width:100%;
  background:var(--gold);color:var(--paper-ink);box-shadow:0 7px 0 var(--gold-dk);transform:translateY(0);transition:transform .06s, box-shadow .06s;letter-spacing:.02em}
.btn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--gold-dk)}
.btn.team{background:var(--team);color:#fff;box-shadow:0 7px 0 var(--team-dk)}
.btn.team:active{box-shadow:0 2px 0 var(--team-dk)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 6px 0 #170c47;font-size:1.1rem;padding:14px}
.btn.ghost:active{box-shadow:0 2px 0 #170c47}
.btn:disabled{opacity:.35;pointer-events:none}
.link{background:none;border:none;color:var(--dim);font:900 .95rem var(--f-b);text-decoration:underline;cursor:pointer;padding:8px}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.row{display:flex;gap:12px}
.row>*{flex:1}

/* mic */
.micwrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.mic{--lvl:0;position:relative;width:min(58vw,210px);aspect-ratio:1;max-width:100%;border-radius:50%;border:none;cursor:pointer;color:#fff;
  background:radial-gradient(circle at 35% 30%,#ff8196,#e3264a 60%,#b0102f);
  box-shadow:0 10px 0 #7d0a22, 0 0 0 calc(8px + var(--lvl)*46px) color-mix(in srgb,var(--a) 28%,transparent);
  display:grid;place-items:center;transition:box-shadow .08s, transform .1s}
.mic:active{transform:translateY(5px);box-shadow:0 5px 0 #7d0a22, 0 0 0 8px color-mix(in srgb,var(--a) 28%,transparent)}
.mic svg{width:38%;height:38%}
.mic.rec{animation:throb 1s infinite}
.mic.done{background:radial-gradient(circle at 35% 30%,#7af0b1,#22b866 60%,#0f7d43);box-shadow:0 10px 0 #0a5a30}
.mic .ring{position:absolute;inset:-14px;border-radius:50%;pointer-events:none}
@keyframes throb{50%{transform:scale(1.05)}}
.miclabel{font-family:var(--f-d);font-size:1.4rem;letter-spacing:.03em}
.timer{font-variant-numeric:tabular-nums;color:var(--dim);font-size:.95rem;height:1.2em}

/* big play */
.play{position:relative;width:min(52vw,190px);aspect-ratio:1;max-width:100%;border-radius:50%;border:none;cursor:pointer;color:#05253a;
  background:radial-gradient(circle at 35% 30%,#8fe2ff,#2fc2ff 60%,#0b84bf);box-shadow:0 10px 0 #075a82;display:grid;place-items:center}
.play:active{transform:translateY(5px);box-shadow:0 5px 0 #075a82}
.play svg{width:40%;height:40%}
.play.spin svg{animation:spin .8s linear infinite}
.play:disabled{filter:grayscale(1);opacity:.45}
@keyframes spin{to{transform:rotate(-360deg)}}
.pips{display:flex;gap:10px;justify-content:center}
.pips i{width:18px;height:18px;border-radius:50%;background:var(--b);box-shadow:0 0 12px var(--b);display:block}
.pips i.used{background:var(--line);box-shadow:none}

/* word card */
.card{background:var(--card);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:14px}
.word{background:var(--paper);color:var(--paper-ink);border-radius:22px;padding:22px 18px;text-align:center;font-family:var(--f-d);
  font-size:clamp(1.9rem,9vw,2.7rem);line-height:1.02;transform:rotate(-2deg);box-shadow:0 8px 0 rgba(0,0,0,.35);animation:flipin .55s cubic-bezier(.2,1.5,.4,1);word-break:break-word}
@keyframes flipin{from{transform:rotateY(90deg) rotate(-2deg)}to{transform:rotate(-2deg)}}
.sylls{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.sylls i{width:14px;height:14px;border-radius:50%;background:var(--gold);display:block}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:6px 14px;font-weight:900;font-size:.9rem}

/* splash */
.splash{background:var(--team);border-radius:30px;padding:34px 20px;text-align:center;box-shadow:0 10px 0 var(--team-dk);display:flex;flex-direction:column;gap:14px;align-items:center;animation:slam .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes slam{from{transform:scale(1.6) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
.splash .huge{text-shadow:0 5px 0 rgba(0,0,0,.25)}
.who{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.who div{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.av{width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.95);color:var(--team-dk);font-family:var(--f-d);font-size:1.8rem;display:grid;place-items:center}
.who span{font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.who b{font-size:1.05rem;max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* bet board */
.bets{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.bet{border:none;border-radius:20px;padding:16px 6px;cursor:pointer;color:#fff;font-family:var(--f-d);display:flex;flex-direction:column;align-items:center;gap:2px;
  box-shadow:0 7px 0 rgba(0,0,0,.35);animation:enter .4s backwards}
.bet:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.bet .n{font-size:2.6rem;line-height:1}
.bet .s{font-family:var(--f-b);font-size:.7rem;letter-spacing:.1em;opacity:.85}
.bet .p{font-size:1.1rem;color:var(--gold)}
.bet .m{font-family:var(--f-b);font-size:.75rem;opacity:.8}

/* inputs */
.inp{width:100%;box-sizing:border-box;font:900 1.35rem var(--f-b);padding:16px;border-radius:18px;border:3px solid var(--line);background:#120a33;color:#fff;text-align:center}
.inp:focus{border-color:var(--gold);outline:none}
.sm{font-size:1rem;padding:12px;text-align:left}

/* reveal */
.stamp{font-family:var(--f-d);font-size:clamp(2.6rem,13vw,3.6rem);padding:4px 18px;border:6px solid currentColor;border-radius:16px;transform:rotate(-8deg);animation:stamp .45s cubic-bezier(.2,1.8,.4,1) backwards;display:inline-block}
.stamp.good{color:var(--good)} .stamp.bad{color:var(--bad)}
@keyframes stamp{from{transform:scale(3) rotate(-8deg);opacity:0}to{transform:rotate(-8deg);opacity:1}}
.delta{font-family:var(--f-d);font-size:3rem;animation:enter .5s .35s backwards}
.delta.good{color:var(--good)} .delta.bad{color:var(--bad)}
.drum{font-family:var(--f-d);font-size:2rem;animation:wobble .18s infinite}
@keyframes wobble{50%{transform:scale(1.08) rotate(2deg)}}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
.chain{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chain .btn{font-size:.95rem;padding:12px 8px}

/* lobby */
.title{text-align:center;padding:10px 0 4px}
.title .huge{font-size:clamp(3rem,16vw,4.6rem)}
.title .mirror{display:block;transform:scaleX(-1);color:var(--gold);text-shadow:0 5px 0 var(--gold-dk)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{font:900 .95rem var(--f-b);padding:10px 14px;border-radius:999px;border:none;background:#120a33;color:var(--dim);cursor:pointer}
.seg button[aria-checked="true"]{background:var(--gold);color:var(--paper-ink)}
.lbl{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:900}
.teamrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tA{border-left:6px solid var(--a);padding-left:10px;display:flex;flex-direction:column;gap:8px}
.tB{border-left:6px solid var(--b);padding-left:10px;display:flex;flex-direction:column;gap:8px}
.err{color:var(--bad);text-align:center}

/* overlay menu */
.overlay{position:fixed;inset:0;background:rgba(10,5,30,.88);z-index:20;overflow:auto;
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px))}
.overlay .card{max-width:480px;margin:0 auto}
.overlay ul{margin:0;padding-left:20px;font-weight:600;display:flex;flex-direction:column;gap:6px}
.tag{font-size:.65rem;color:var(--gold);border:1px solid var(--gold);border-radius:4px;padding:0 4px;margin-left:4px;font-weight:900}
#fx{position:fixed;inset:0;pointer-events:none;z-index:30;width:100%;height:100%}
.code{font-family:var(--f-d);font-size:clamp(3.4rem,18vw,5rem);letter-spacing:.18em;line-height:1;color:var(--gold);text-shadow:0 6px 0 var(--gold-dk)}
.dots{display:flex;gap:8px;justify-content:center}
.dots i{width:12px;height:12px;border-radius:50%;background:#fff;opacity:.85;animation:bob 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bob{50%{transform:translateY(-8px);opacity:.4}}
.pl{font-weight:900;font-size:1.05rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl.off{opacity:.45}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

// ---------- Word bank: [phrase, syllables] by category ----------
const BANK = {

    ["under the weather",5],["once in a blue moon",5],["practice makes perfect",5],["there's no place like home",5],["bite the bullet now",5],
    ["hit the nail on the head",6],["the ball is in your court",6],["it takes two to tango",6],["a blessing in disguise",6],["barking up the wrong tree",6],["a penny for your thoughts",6],
    ["the elephant in the room",7],["the grass is always greener",7],["let the cat out of the bag",7],["Rome wasn't built in a day",7],["all that glitters is not gold",7],["actions speak louder than words",7],["the early bird gets the worm",7],["the squeaky wheel gets the grease",7],

for(const c in BANK) BANK[c]=BANK[c].filter(([w,n])=>n>=3 && n<=8);
const CATS = Object.keys(BANK);
const PTS_PER_SYL = 10;
const pointsFor = s => s * PTS_PER_SYL;
const penaltyFor = s => Math.ceil(pointsFor(s) / 2);
const MAX_REC_MS = 12000;

// Rough syllable estimate for words the other team types in
function estSyl(text){
  return text.toLowerCase().replace(/[^a-z ]/g," ").split(/\s+/).filter(Boolean).reduce((n,w)=>{
    if(w.length<=3) return n+1;
    w=w.replace(/(?:[^laeiouy]es|ed|[^laeiouy]e)$/,"").replace(/^y/,"");
    const m=w.match(/[aeiouy]{1,2}/g); return n+Math.max(1,m?m.length:1);
  },0);
}

// ---------- Audio ----------
let actx = null, stream = null, playing = null, micBlocked = false;
function ac(){ if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended") actx.resume(); return actx; }
function decode(ab){ return new Promise((res,rej)=>ac().decodeAudioData(ab,res,rej)); }
function stopPlay(){ if(playing){ const p=playing; playing=null; try{p.stop()}catch(e){} } }
function play(buf,onEnd){
  stopPlay(); const c=ac(); const s=c.createBufferSource(); s.buffer=buf; s.connect(c.destination);
  s.onended=()=>{ if(playing===s){ playing=null; onEnd&&onEnd(); } }; s.start(); playing=s;
}
function reverseBuf(buf){
  const out=ac().createBuffer(buf.numberOfChannels,buf.length,buf.sampleRate);
  for(let ch=0;ch<buf.numberOfChannels;ch++){ const a=buf.getChannelData(ch), b=out.getChannelData(ch), n=a.length; for(let i=0;i<n;i++) b[i]=a[n-1-i]; }
  return out;
}
function trimBuf(buf){
  const d=buf.getChannelData(0); let peak=0; for(let i=0;i<d.length;i++){ const v=Math.abs(d[i]); if(v>peak) peak=v; }
  const th=Math.max(0.015,peak*0.06); let st=0, en=d.length-1;
  while(st<d.length && Math.abs(d[st])<th) st++;
  while(en>st && Math.abs(d[en])<th) en--;
  const pad=Math.floor(buf.sampleRate*0.08); st=Math.max(0,st-pad); en=Math.min(d.length-1,en+pad);
  if(en-st < buf.sampleRate*0.2) return buf;
  const out=ac().createBuffer(buf.numberOfChannels,en-st+1,buf.sampleRate);
  for(let ch=0;ch<buf.numberOfChannels;ch++) out.getChannelData(ch).set(buf.getChannelData(ch).subarray(st,en+1));
  return out;
}
async function getStream(){
  if(stream && stream.active) return stream;
  stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
  return stream;
}
let activeRec=null;
async function startRec(onDone,onFail){
  ac();
  try{
    const s=await getStream(); const chunks=[]; const mr=new MediaRecorder(s);
    mr.ondataavailable=e=>{ if(e.data && e.data.size) chunks.push(e.data); };
    mr.onstop=async()=>{
      clearTimeout(mr._t); activeRec=null;
      try{ const blob=new Blob(chunks,{type:mr.mimeType||"audio/webm"}); const buf=await decode(await blob.arrayBuffer()); onDone(trimBuf(buf)); }
      catch(e){ onFail("Could not read that recording. Try again."); }
    };
    mr.start(); mr._t=setTimeout(()=>{ if(mr.state==="recording") mr.stop(); },MAX_REC_MS);
    activeRec=mr; return true;
  }catch(e){ micBlocked=true; onFail(null); return false; }
}
function stopRec(){ if(activeRec && activeRec.state==="recording") activeRec.stop(); }
async function fileToBuf(file){ ac(); return trimBuf(await decode(await file.arrayBuffer())); }

function drawWave(canvas,buf,color){
  const dpr=window.devicePixelRatio||1, w=canvas.clientWidth, h=canvas.clientHeight;
  canvas.width=w*dpr; canvas.height=h*dpr; const g=canvas.getContext("2d"); g.scale(dpr,dpr);
  const d=buf.getChannelData(0), bars=Math.max(20,Math.floor(w/4)), step=Math.floor(d.length/bars)||1;
  let max=0; const vals=[];
  for(let i=0;i<bars;i++){ let m=0; for(let j=i*step;j<(i+1)*step && j<d.length;j+=4){ const v=Math.abs(d[j]); if(v>m) m=v; } vals.push(m); if(m>max) max=m; }
  g.fillStyle=color;
  vals.forEach((v,i)=>{ const bh=Math.max(2,(v/(max||1))*(h-12)); g.fillRect(i*(w/bars)+1,(h-bh)/2,Math.max(1,w/bars-2),bh); });
}

let DECKS={}; try{ DECKS=JSON.parse(localStorage.getItem("rvg-decks")||"{}"); }catch(e){}
function rng(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function deckList(cat,level){ return BANK[cat].filter(([w,n])=>level==null || n===level); }
function drawFrom(key,list){
  let d=DECKS[key]; if(!d || d.n!==list.length || d.pos>=list.length) d=DECKS[key]={seed:(Math.random()*2**31)|0,pos:0,n:list.length};
  const r=rng(d.seed), order=list.map((_,i)=>i);
  for(let i=order.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [order[i],order[j]]=[order[j],order[i]]; }
  const item=list[order[d.pos++]]; try{ localStorage.setItem("rvg-decks",JSON.stringify(DECKS)); }catch(e){}
  return item;
}
function drawWord(cat,level){
  let list=deckList(cat,level), key=cat+"|"+(level??"any"), fellBack=false;
  if(!list.length){ list=CATS.flatMap(c=>deckList(c,level)); key="all|"+level; fellBack=true; }
  const [w,n]=drawFrom(key,list); return {word:w,syl:n,fellBack,drawn:true};
}
async function loadWords(){
  try{
    const r=await fetch("words.json",{cache:"no-cache"}); if(!r.ok) return; const data=await r.json();
    for(const k of Object.keys(BANK)) delete BANK[k];
    for(const [cat,levels] of Object.entries(data)){ BANK[cat]=[]; for(const [n,arr] of Object.entries(levels)) for(const w of arr) BANK[cat].push([w,+n]); }
    CATS.splice(0,CATS.length,...Object.keys(BANK));
    WORD_COUNT=CATS.reduce((a,c)=>a+BANK[c].length,0);
    if(!CATS.includes(S.category) && S.category!=="Mixed") S.category=CATS[0];
    if(["title","setup"].includes(S.screen)) render();
  }catch(e){}
}

const norm = s => s.toLowerCase().replace(/[’']/g,"").replace(/[^a-z0-9 ]+/g," ").replace(/\b(a|an|the)\b/g," ").replace(/\s+/g," ").trim();
function lev(a,b){ const m=a.length,n=b.length; const d=Array.from({length:m+1},(_,i)=>[i]); for(let j=1;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++) d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return d[m][n]; }
function judge(guess,answer){ const g=norm(guess), a=norm(answer); if(!g) return false; if(g===a || g.replace(/ /g,"")===a.replace(/ /g,"")) return true; return lev(g,a) <= Math.max(1,Math.floor(a.length/10)); }

// ---------- sound effects ----------
function tone(f,dur,type="sine",vol=.15,when=0,to){
  if(S.muted) return; const c=ac(), t=c.currentTime+when, o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t); if(to) o.frequency.exponentialRampToValueAtTime(to,t+dur);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.012); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+.03);
}
let noiseBuf=null;
function noise(dur,vol,when=0,f0=1000,f1){
  if(S.muted) return; const c=ac();
  if(!noiseBuf){ noiseBuf=c.createBuffer(1,c.sampleRate,c.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
  const t=c.currentTime+when, s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain();
  s.buffer=noiseBuf; f.type="bandpass"; f.Q.value=1.2; f.frequency.setValueAtTime(f0,t); if(f1) f.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f); f.connect(g); g.connect(c.destination); s.start(t); s.stop(t+dur+.02);
}

// ---------- confetti ----------
const fx=document.getElementById("fx"), fxg=fx.getContext("2d"); let parts=[], fxOn=false;
function confetti(n=140){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const w=innerWidth, cols=["#ffd23f","#ff4f6d","#2fc2ff","#3fe08a","#ffffff","#b18cff"];
  for(let i=0;i<n;i++) parts.push({x:w/2+(Math.random()-.5)*80,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*15-5,r:Math.random()*6+4,c:cols[i%cols.length],a:Math.random()*6,va:(Math.random()-.5)*.4,life:120+Math.random()*60});
  if(!fxOn){ fxOn=true; requestAnimationFrame(tickFx); }
}
function tickFx(){
  const dpr=devicePixelRatio||1; if(fx.width!==innerWidth*dpr){ fx.width=innerWidth*dpr; fx.height=innerHeight*dpr; }
  fxg.setTransform(dpr,0,0,dpr,0,0); fxg.clearRect(0,0,innerWidth,innerHeight);
  parts.forEach(p=>{ p.vy+=.45; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.a+=p.va; p.life--; fxg.save(); fxg.translate(p.x,p.y); fxg.rotate(p.a); fxg.fillStyle=p.c; fxg.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); fxg.restore(); });
  parts=parts.filter(p=>p.life>0 && p.y<innerHeight+40);
  if(parts.length) requestAnimationFrame(tickFx); else { fxOn=false; fxg.clearRect(0,0,innerWidth,innerHeight); }
}

let analyser=null, meterRaf=0, recTimer=0, recStart=0;
async function ensureMic(){
  try{ await getStream(); S.micError=""; return true; }
  catch(e){ let framed=false; try{ framed=window.top!==window.self; }catch(_){ framed=true; }
    S.micError = framed ? "The mic is blocked in this preview. Open the game from its own app link to record." : location.protocol==="https:"||location.hostname==="localhost" ? "Microphone blocked. Allow mic access for this site in your browser settings, then reload." : "This page needs to be opened from its https link to use the mic."; return false; }
}
async function recordInto(key,btn,onDone){
  if(activeRec){ stopRec(); return; }
  stopPlay();
  if(!(await ensureMic())){ render(); return; }
  SFX.recOn(); buzz(30);
  await new Promise(r=>setTimeout(r,180));
  const s=await getStream(); const chunks=[]; let mr;
  try{ mr=new MediaRecorder(s); }catch(e){ S.micError="Recording is not supported in this browser."; render(); return; }
  mr.ondataavailable=e=>{ if(e.data && e.data.size) chunks.push(e.data); };
  mr.onstop=async()=>{
    clearTimeout(mr._t); cancelAnimationFrame(meterRaf); clearInterval(recTimer); activeRec=null;
    SFX.recOff(); buzz(20);
    try{ const blob=new Blob(chunks,{type:mr.mimeType||"audio/mp4"}); const buf=trimBuf(await decode(await blob.arrayBuffer())); S.turn[key]=buf; onDone(buf,blob); }
    catch(e){ S.micError="Could not read that recording. Try again."; render(); }
  };
  mr.start(); activeRec=mr; recStart=Date.now();
  mr._t=setTimeout(()=>{ if(mr.state==="recording") mr.stop(); },REC_LIMIT);
  btn.classList.add("rec"); btn.innerHTML=ICON.stop;
  const lbl=document.getElementById("micLbl"), tm=document.getElementById("micTimer");
  if(lbl) lbl.textContent="Tap to stop";
  recTimer=setInterval(()=>{ if(tm) tm.textContent=((Date.now()-recStart)/1000).toFixed(1)+"s"; },100);
  try{
    const c=ac(); if(!analyser || analyser._s!==s){ analyser=c.createAnalyser(); analyser.fftSize=512; c.createMediaStreamSource(s).connect(analyser); analyser._s=s; }
    const data=new Uint8Array(analyser.fftSize);
    const loop=()=>{ analyser.getByteTimeDomainData(data); let m=0; for(const v of data){ const d=Math.abs(v-128)/128; if(d>m) m=d; } btn.style.setProperty("--lvl",Math.min(1,m*1.8).toFixed(2)); meterRaf=requestAnimationFrame(loop); };
    loop();
  }catch(e){}
}

  },
  bet(){

      <div class="sylls" id="est" aria-live="polite">${n?Array.from({length:n},()=>"<i></i>").join("")+`<span class="dim" style="margin-left:6px">≈${n}</span>`:""}</div>
      <button class="btn" id="lock" ${t.entry.trim()?"":"disabled"}>LOCK IT IN</button>
      <button class="btn ghost" id="rand">🎲 Surprise me</button>`,
      bind(){

  listen(){
    const t=S.turn;

      <button class="play" id="pl" ${t.sPlays?"":"disabled"} aria-label="Play backward">${ICON.rew}</button>
      <div class="pips">${Array.from({length:S.speakerPlays},(_,i)=>`<i class="${i<S.speakerPlays-t.sPlays?"used":""}"></i>`).join("")}</div>

  mimic(){

  handGss(){
    return { cls:"center", html:`<div class="splash"><span class="kicker" style="color:#fff">Phone to</span><div class="av" style="width:90px;height:90px;font-size:2.6rem">${esc(guesser().slice(0,1).toUpperCase())}</div>
      <h1 class="huge">${esc(guesser())}</h1><p>${esc(t_hint())}</p></div>
      <button class="btn" id="go">I'M READY</button>`,
      bind(){ $("go").onclick=()=>go("hear","whoosh"); } };
  },
  hear(){
    const t=S.turn, lim=S.guesserPlays, left=t.gPlays, heard=t.heard;
    return { cls:"center", html:`<span class="kicker">${esc(t.cat)}${pts()?` · ${t.level} syllables`:""}</span><h2 class="big-t">What did ${esc(speaker())} say?</h2>
      <button class="play" id="pl" ${left?"":"disabled"} aria-label="Play clip">${ICON.play}</button>
      ${lim?`<div class="pips">${Array.from({length:lim},(_,i)=>`<i class="${i<lim-left?"used":""}"></i>`).join("")}</div><p class="dim">${left} listen${left===1?"":"s"} left</p>`:`<p class="dim">Listen as much as you want</p>`}
      ${pts()?`<input class="inp" id="guess" autocomplete="off" autocapitalize="off" placeholder="Your guess" value="${esc(t.guess)}" ${heard?"":"disabled"}>
        <button class="btn team" id="submit" ${heard?"":"disabled"}>FINAL ANSWER</button><button class="link" id="giveup" ${heard?"":"hidden"}>Give up</button>`
      :`<button class="btn team" id="reveal" ${heard?"":"disabled"}>REVEAL IT</button>`}`,
      bind(){
        const p=$("pl");
        p.onclick=()=>{ if(!t.gPlays) return; if(lim) t.gPlays--; t.heard=true; buzz(15); p.classList.add("spin"); p.disabled=true; play(t.copyFlip,()=>render()); };
        if(pts()){
          const g=$("guess"); g.oninput=()=>t.guess=g.value; g.onkeydown=e=>{ if(e.key==="Enter") $("submit").click(); };
          $("submit").onclick=()=>{ if(!t.guess.trim()){ g.focus(); return; } finish(judge(t.guess,t.word)); };
          $("giveup").onclick=()=>{ t.guess=""; finish(false); };
        } else $("reveal").onclick=()=>finish(null);
      } };
  },
  drum(){
    return { cls:"center", html:`<div class="drum">🥁</div><h2 class="big-t">${pts()?`“${esc(S.turn.guess||"…")}”`:"And the word was…"}</h2>` };
  },
  reveal(){
    const t=S.turn, ok=t.correct, d=ok?pointsFor(t.level):-penaltyFor(t.level), last=pts() && S.round>S.rounds;
    const hearer=S.teams[t.team].players[1-(S.teams[t.team].turns-1)%2];
    return { cls:"center"+(pts()&&!ok?" shake":""), html:`
      ${pts()?`<div class="stamp ${ok?"good":"bad"}">${ok?"NAILED IT":t.guess?"NOPE":"GAVE UP"}</div>`:""}
      <div class="word">${esc(t.word)}</div>
      ${pts()?`<div class="delta ${ok?"good":"bad"}">${d>0?"+":"−"}${Math.abs(d)}</div>`
        :`<div class="row" style="width:100%"><button class="btn ghost" id="gotIt">${t.correct===true?"✅ ":""}Got it</button><button class="btn ghost" id="missed">${t.correct===false?"❌ ":""}Missed</button></div>`}
      <div class="card" style="width:100%;box-sizing:border-box"><span class="lbl">Hear the whole chain</span><div class="chain">
        <button class="btn ghost" id="c1">1 · Original</button><button class="btn ghost" id="c2">2 · Backward</button>
        <button class="btn ghost" id="c3">3 · Backward copy</button><button class="btn ghost" id="c4">4 · What ${esc(hearer)} heard</button></div>
        ${pts()?`<button class="link" id="flip">${ok?"That's wrong, mark it a miss":"Close enough? Count it"}</button>`:""}</div>
      <button class="btn" id="next">${last?"FINAL SCORES":"NEXT TURN"}</button>${!pts()?`<button class="link" id="end">End game</button>`:""}`,
      bind(){
        $("c1").onclick=()=>play(t.orig); $("c2").onclick=()=>play(t.origRev); $("c3").onclick=()=>play(t.copy); $("c4").onclick=()=>play(t.copyFlip);
        if(pts()) $("flip").onclick=()=>{ const before=S.teams[t.team].score; applyScore(-1); t.correct=!t.correct; applyScore(1); render(); countUp($("sc"+t.team),before,S.teams[t.team].score); if(t.correct){SFX.win();confetti();} else SFX.lose(); };
        else { $("gotIt").onclick=()=>{ t.correct=true; t.log.ok=true; SFX.win(); confetti(80); render(); }; $("missed").onclick=()=>{ t.correct=false; t.log.ok=false; SFX.lose(); render(); }; $("end").onclick=()=>go("final","fanfare"); }
        $("next").onclick=()=>{ if(last){ go("final","fanfare"); setTimeout(()=>confetti(220),200); } else { newTurn(); go("splash","slam"); } };
      } };
  },
  final(){
    const [A,B]=S.teams, tie=A.score===B.score, w=A.score>B.score?A:B, wi=A.score>B.score?0:1;
    const tally=i=>S.history.filter(h=>h.team===i && h.ok).length;
    if(pts() && !tie) document.body.dataset.team=String(wi);
    return { cls:"center", html:`<div class="splash"><div style="font-size:4rem;line-height:1">🏆</div>
      <h1 class="huge">${pts()?(tie?"IT'S A TIE":esc(w.name)+" WINS"):"GG!"}</h1>
      <p class="d" style="font-size:1.6rem">${pts()?`${A.score} : ${B.score}`:`${esc(A.name)} ${tally(0)} · ${esc(B.name)} ${tally(1)}`}</p></div>
      <button class="btn" id="again">REMATCH</button><button class="btn ghost" id="newg">New setup</button>
      <div class="card" style="width:100%;box-sizing:border-box;text-align:left"><span class="lbl">Every turn</span>
      ${S.history.map(h=>`<p>${esc(S.teams[h.team].name)} · <b>${esc(h.word)}</b> ${pts()?`<span style="color:${h.d>0?"var(--good)":"var(--bad)"}">${h.d>0?"+":"−"}${Math.abs(h.d)}</span>`:(h.ok===true?"✅":h.ok===false?"❌":"")}</p>`).join("")||`<p class="dim">No turns played.</p>`}</div>`,
      bind(){
        $("again").onclick=()=>{ S.teams.forEach(t=>{t.score=0;t.turns=0;}); S.round=1; S.turnTeam=0; S.history=[]; newTurn(); go("splash","slam"); };
        $("newg").onclick=()=>go("setup","tap");
      } };
  }
};
function t_hint(){ return `Category: ${S.turn.cat}${pts()?` · worth ${pointsFor(S.turn.level)}`:""}`; }
function applyScore(sign){ const t=S.turn, d=t.correct?pointsFor(t.level):-penaltyFor(t.level); S.teams[t.team].score+=sign*d; if(sign>0) t.log.d=d; }
function finish(correct){
  const t=S.turn; t.correct=correct;
  t.log={team:t.team,word:t.word,level:t.level,d:0,ok:correct}; S.history.push(t.log);
  const before=S.teams[t.team].score;
  go("drum"); SFX.drum(); buzz([20,40,20,40,20]);
  setTimeout(()=>{
    if(pts()) applyScore(1);
    S.teams[t.team].turns++;
    S.turnTeam=1-S.turnTeam; if(S.turnTeam===0) S.round++;
    go("reveal"); SFX.slam();
    if(pts()){ countUp($("sc"+t.team),before,S.teams[t.team].score); if(correct){ setTimeout(()=>{SFX.win();confetti();buzz(60);},150); } else setTimeout(()=>{SFX.lose();buzz([80,60,80]);},150); }
  },1500);
}


// ================= Online mode: every player on their own phone =================
const O = { ws:null, st:null, code:"", pid:"", name:"", err:"", clips:{}, local:{}, mimic:false, lastReveal:0, retry:0, closed:false, pickDraft:"", guessDraft:"" };
try{ O.pid = localStorage.getItem("rvg-pid") || ""; O.name = localStorage.getItem("rvg-name") || ""; }catch(e){}
if(!O.pid){ O.pid = Math.random().toString(36).slice(2,12)+Date.now().toString(36); try{ localStorage.setItem("rvg-pid",O.pid); }catch(e){} }
const ONLINE_OK = location.protocol.startsWith("http") && !/claudeusercontent|claude\.ai/.test(location.hostname);

const ost = () => O.st;
const oturn = () => O.st && O.st.turn;
const oname = id => (O.st && O.st.players[id] && O.st.players[id].name) || "Someone";
const omyTeam = () => O.st && O.st.players[O.pid] ? O.st.players[O.pid].team : 0;
const opts = () => O.st && O.st.settings.mode === "points";
const send = m => { try{ O.ws && O.ws.readyState===1 && O.ws.send(JSON.stringify(m)); }catch(e){} };
function onlineTeamColor(){
  const s=O.st; if(!s) return 0;
  if(["lobby"].includes(s.phase)) return omyTeam();
  if(s.phase==="pick") return 1-s.turn.team;
  if(s.turn) return s.turn.team;
  return omyTeam();
}
function newCode(){ const A="BCDFGHJKLMNPQRSTVWXZ"; let c=""; for(let i=0;i<4;i++) c+=A[Math.floor(Math.random()*A.length)]; return c; }

function connect(code){
  O.code = code; O.closed=false; O.err="";
  try{ history.replaceState(null,"","?room="+code); }catch(e){}
  const ws = new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/api/room/"+code+"/ws?pid="+encodeURIComponent(O.pid));
  O.ws = ws;
  ws.onopen = ()=>{ O.retry=0; send({type:"hello", name:O.name}); };
  ws.onmessage = ev => {
    let m; try{ m=JSON.parse(ev.data); }catch(e){ return; }
    if(m.type==="state"){ const prev=O.st; O.st=m.state; onState(prev); }
    else if(m.type==="play"){ playGuesserClip(); }
    else if(m.type==="error"){ O.err=m.message; orender(); }
  };
  ws.onclose = ()=>{ if(O.closed) return; O.retry++; setTimeout(()=>{ if(!O.closed) connect(O.code); }, Math.min(5000, 500*O.retry)); };
}
function leaveRoom(){ O.closed=true; try{ O.ws && O.ws.close(); }catch(e){} O.ws=null; O.st=null; O.clips={}; O.local={}; try{ history.replaceState(null,"",location.pathname); }catch(e){} }

async function getClip(kind){
  const key=kind+":"+O.st.clipVer;
  if(O.clips[key]) return O.clips[key];
  const r = await fetch("/api/room/"+O.code+"/clip/"+kind,{cache:"no-store"});
  if(!r.ok) throw new Error("clip "+r.status);
  const buf = trimBuf(await decode(await r.arrayBuffer()));
  const v = {buf, rev:reverseBuf(buf)}; O.clips[key]=v; return v;
}
async function upload(kind, blob){
  const r = await fetch("/api/room/"+O.code+"/clip/"+kind+"?pid="+encodeURIComponent(O.pid),{method:"PUT",body:blob,headers:{"Content-Type":blob.type||"audio/webm"}});
  if(!r.ok) throw new Error("Upload failed ("+r.status+")");
}
async function playGuesserClip(){
  try{ const c=await getClip("copy"); SFX.tap(); play(c.rev,()=>orender()); const b=$("pl"); if(b){ b.classList.add("spin"); b.disabled=true; } }
  catch(e){ O.err="Couldn't load the clip. Check your connection."; orender(); }
}

// Re-render without cutting off audio or a recording in progress, and keep typing focus.
let pendingRender=false;
function orender(){
  if(S.screen!=="online") return;
  if(activeRec){ pendingRender=true; return; }
  const f=document.activeElement, fid=f&&f.id, sel=f&&f.selectionStart;
  KEEP_AUDIO=true; render(); KEEP_AUDIO=false;
  if(fid){ const el=$(fid); if(el && el.tagName==="INPUT"){ el.focus(); try{ el.setSelectionRange(sel,sel); }catch(e){} } }
}
function onState(prev){
  const s=O.st, t=s.turn;
  // new turn: clear local recordings
  if(!prev || !prev.turn || !t || prev.turn.n!==t.n){ O.local={}; O.mimic=false; O.pickDraft=""; O.guessDraft=""; }
  if(prev && prev.phase!==s.phase){
    if(s.phase==="bet"||s.phase==="pick") SFX.slam();
    if(s.phase==="speak"||s.phase==="guess") SFX.whoosh();
    if(s.phase==="guess" && t.guesserId===O.pid) buzz([40,40,40]);
    if(s.phase==="final"){ SFX.fanfare(); setTimeout(()=>confetti(220),200); }
  }
  if(s.phase==="reveal" && t && O.lastReveal!==t.n && prev){
    O.lastReveal=t.n; SFX.slam();
    if(s.settings.mode==="points"){ if(t.correct){ setTimeout(()=>{SFX.win();confetti();buzz(60);},150); } else setTimeout(()=>{SFX.lose();buzz([80,60,80]);},150); }
  }
  if(s.phase==="guess" && t.guesserId===O.pid) getClip("copy").catch(()=>{});
  if(s.phase==="reveal") { getClip("orig").catch(()=>{}); getClip("copy").catch(()=>{}); }
  orender();
}

function onlineTopbar(){
  const s=O.st;
  const sc = !s ? "" : s.phase==="lobby" ? `<div class="chip">Room ${esc(O.code)}</div>`
    : s.settings.mode==="points" ? `<div class="scores"><span class="s sa ${s.turnTeam===0?"on":""}">${s.scores[0]}</span><span class="dim">:</span><span class="s sb ${s.turnTeam===1?"on":""}">${s.scores[1]}</span></div>`
    : `<div class="chip">Room ${esc(O.code)}</div>`;
  return `<div class="bar"><div class="logo"><span>◀◀</span><span>REVERSE</span></div>${sc}<button class="iconbtn" id="menuBtn" aria-label="Menu">${ICON.menu}</button></div>`;
}

const av = (id,big) => `<div class="av" style="${big?"width:90px;height:90px;font-size:2.6rem":""}">${esc(oname(id).slice(0,1).toUpperCase())}</div>`;
const waitCard = (title,sub,id) => `<div class="splash">${id?av(id,true):""}<h1 class="big-t">${title}</h1>${sub?`<p>${sub}</p>`:""}<div class="dots"><i></i><i></i><i></i></div></div>`;
const errHTML = () => O.err?`<p class="err">${esc(O.err)}</p>`:"";

VIEWS.online = function(){
  const s=O.st;
  if(!s) return O.code ? { cls:"center", html: waitCard("Joining "+esc(O.code)+"…","") } : onlineJoin();
  const v = (ONLINE_VIEWS[s.phase]||ONLINE_VIEWS.lobby)();
  const inner=v.bind;
  v.bind=()=>{ document.body.dataset.team=String(onlineTeamColor()); inner&&inner(); };
  return v;
};

function onlineJoin(){
  const q = new URLSearchParams(location.search).get("room")||"";
  return { cls:"center", html:`<h2 class="big-t">Play on your own phones</h2>
    <p class="dim">One person creates a room. Everyone else joins with the code.</p>
    <input class="inp" id="oname" maxlength="20" autocomplete="off" placeholder="Your name" value="${esc(O.name)}">
    <button class="btn" id="create">CREATE ROOM</button>
    <div class="row" style="width:100%"><input class="inp" id="ocode" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="CODE" value="${esc(q.toUpperCase())}" style="text-transform:uppercase;letter-spacing:.2em"><button class="btn team" id="join" style="flex:0 0 40%">JOIN</button></div>
    ${errHTML()}<button class="link" id="back">Back</button>`,
    bind(){
      const nm=()=>{ const n=$("oname").value.trim(); if(!n){ O.err="Type your name first."; orender(); $("oname").focus(); return false; } O.name=n; try{ localStorage.setItem("rvg-name",n); }catch(e){} return true; };
      $("create").onclick=()=>{ if(!nm()) return; ac(); ensureMic(); SFX.go(); connect(newCode()); orender(); };
      $("join").onclick=()=>{ const c=$("ocode").value.trim().toUpperCase(); if(!nm()) return; if(!/^[A-Z]{4}$/.test(c)){ O.err="Room codes are 4 letters."; orender(); return; } ac(); ensureMic(); SFX.go(); connect(c); orender(); };
      $("ocode").onkeydown=e=>{ if(e.key==="Enter") $("join").click(); };
      $("back").onclick=()=>{ O.err=""; go("title"); };
    } };
}

const ONLINE_VIEWS = {
  lobby(){
    const s=O.st, host=s.hostId===O.pid, link=location.origin+location.pathname+"?room="+O.code;
    const col = t => `<div class="${t?"tB":"tA"}"><div class="row" style="align-items:center"><b class="d" style="font-size:1.3rem">${esc(s.teamNames[t])}</b></div>
      ${s.order.filter(id=>s.players[id] && s.players[id].team===t).map(id=>`<div class="pl ${s.connected.includes(id)?"":"off"}">${esc(oname(id))}${id===s.hostId?" 👑":""}${id===O.pid?" (you)":""}</div>`).join("")||`<div class="dim">Nobody yet</div>`}
      ${omyTeam()!==t?`<button class="btn ghost" data-team="${t}" style="font-size:.95rem;padding:10px">Join ${esc(s.teamNames[t])}</button>`:""}</div>`;
    const st=s.settings, cats=[...CATS,"Mixed"];
    const ready = [0,1].every(t=>s.order.filter(id=>s.players[id]&&s.players[id].team===t).length>=2);
    return { html:`<div class="center" style="display:flex;flex-direction:column;align-items:center;gap:6px">
        <span class="kicker">Room code</span><div class="code">${esc(O.code)}</div>
        <button class="btn ghost" id="share" style="width:auto;padding:10px 18px;font-size:1rem">📲 Invite players</button></div>
      <div class="card"><div class="teamrow">${col(0)}${col(1)}</div></div>
      ${host?`<div class="card">
        <span class="lbl">Mode</span>${seg("mode",[["points","🏆 Points"],["casual","🎉 Casual"]],st.mode)}
        <span class="lbl">Who picks the word</span>${seg("source",[["opponent","Other team"],["random","Random"]],st.source)}
        <span class="lbl">Category</span>${seg("cat",cats.map(c=>[c,c]),st.category)}
        <span class="lbl">Guesser hears the clip</span>${seg("gp",[[1,"1×"],[2,"2×"],[0,"∞"]],st.guesserPlays)}
        ${st.mode==="points"?`<span class="lbl">Rounds</span>${seg("rounds",[[2,"2"],[4,"4"],[6,"6"],[8,"8"]],st.rounds)}`:""}</div>
        ${errHTML()}<button class="btn" id="start" ${ready?"":"disabled"}>${ready?"START GAME":"NEED 2 PER TEAM"}</button>`
      :`<div class="card center"><p class="dim">${esc(oname(s.hostId))} is setting up: ${st.mode==="points"?"Points":"Casual"} · ${esc(st.category)} · ${st.source==="opponent"?"other team picks":"random words"}</p></div>${waitCard("Waiting for the host","")}`}`,
      bind(){
        document.querySelectorAll("[data-team]").forEach(b=>b.onclick=()=>{ SFX.tap(); send({type:"team",team:+b.dataset.team}); });
        $("share").onclick=async()=>{ try{ if(navigator.share){ await navigator.share({title:"Reverse",text:"Join my game. Room code "+O.code,url:link}); return; } }catch(e){ return; }
          try{ await navigator.clipboard.writeText(link); $("share").textContent="Link copied"; }catch(e){ $("share").textContent=link; } };
        if(host){
          const set=x=>send({type:"settings",settings:Object.assign({},st,x)});
          const segb=(id,fn)=>$(id)&&$(id).querySelectorAll("button").forEach(b=>b.onclick=()=>{ SFX.tap(); fn(b.dataset.v); });
          segb("mode",v=>set({mode:v})); segb("source",v=>set({source:v})); segb("cat",v=>set({category:v})); segb("gp",v=>set({guesserPlays:+v})); segb("rounds",v=>set({rounds:+v}));
          $("start").onclick=()=>{ ac(); SFX.go(); try{ navigator.wakeLock && navigator.wakeLock.request("screen").catch(()=>{}); }catch(e){} send({type:"start"}); };
        }
      } };
  },
  bet(){
    const s=O.st, t=s.turn;
    if(t.speakerId!==O.pid) return { cls:"center", html: waitCard(`${esc(oname(t.speakerId))} is placing a bet`, `${esc(s.teamNames[t.team])} team · ${esc(t.cat)}`, t.speakerId) };
    const hues=["#3f5bd8","#6a3fd8","#a63fd0","#d03f9c","#e2445f","#f0632e"];
    return { cls:"center", html:`<span class="kicker">You're the Speaker · ${esc(t.cat)}</span><h2 class="big-t">How big are you going?</h2>
      <div class="bets">${[3,4,5,6,7,8].map((n,i)=>`<button class="bet" data-l="${n}" style="background:${hues[i]};animation-delay:${i*50}ms"><span class="n">${n}</span><span class="s">SYLLABLES</span><span class="p">+${pointsFor(n)}</span><span class="m">miss −${penaltyFor(n)}</span></button>`).join("")}</div>`,
      bind(){ document.querySelectorAll(".bet").forEach(b=>b.onclick=()=>{ SFX.coin(); buzz(15); send({type:"bet",level:+b.dataset.l}); }); } };
  },
  pick(){
    const s=O.st, t=s.turn, mine=omyTeam()!==t.team, n=O.pickDraft.trim()?estSyl(O.pickDraft):0;
    if(!mine) return { cls:"center", html: waitCard(`${esc(s.teamNames[1-t.team])} is picking your word`, `${esc(t.cat)}${opts()?` · ${t.level} syllables`:""}`) };
    return { cls:"center", html:`<div class="splash" style="padding:22px 18px"><span class="kicker" style="color:#fff">Your team picks</span>
      <h1 class="big-t">Give ${esc(oname(t.speakerId))} a word</h1><p>A ${esc(single(t.cat))}${opts()?` with <b>${t.level} syllables</b>`:""}. ${esc(oname(t.guesserId))} has to guess it.</p></div>
      <input class="inp" id="entry" autocomplete="off" autocapitalize="off" placeholder="Type it" value="${esc(O.pickDraft)}">
      <div class="sylls" id="est">${n?Array.from({length:n},()=>"<i></i>").join("")+`<span class="dim" style="margin-left:6px">≈${n}${opts()&&n!==t.level?` (needs ${t.level})`:""}</span>`:""}</div>
      <button class="btn" id="lock" ${O.pickDraft.trim()?"":"disabled"}>SEND IT</button>
      <button class="btn ghost" id="rand">🎲 Surprise them</button>`,
      bind(){
        const e=$("entry"), l=$("lock");
        e.oninput=()=>{ O.pickDraft=e.value; l.disabled=!e.value.trim(); const k=e.value.trim()?estSyl(e.value):0;
          $("est").innerHTML=k?Array.from({length:k},()=>"<i></i>").join("")+`<span class="dim" style="margin-left:6px">≈${k}${opts()&&k!==t.level?` (needs ${t.level})`:""}</span>`:""; };
        e.onkeydown=ev=>{ if(ev.key==="Enter" && e.value.trim()) l.click(); };
        l.onclick=()=>{ SFX.slam(); send({type:"pick",word:O.pickDraft}); };
        $("rand").onclick=()=>{ SFX.slam(); send({type:"pick",random:true}); };
      } };
  },
  speak(){
    const s=O.st, t=s.turn;
    if(t.speakerId!==O.pid){
      const sub = t.word ? `The word: <b>${esc(t.word)}</b>` : `${esc(oname(t.guesserId))}, get ready to guess.`;
      const what = !t.clips.orig ? "is saying the word" : !t.clips.copy ? "is saying it backward" : "is about to send it";
      return { cls:"center", html: waitCard(`${esc(oname(t.speakerId))} ${what}`, sub, t.speakerId) };
    }
    S.turn = O.local;
    const L=O.local;
    // Stage 1: say it
    if(!t.clips.orig) return { cls:"center", html:`<span class="kicker">You're the Speaker · say it normally</span>
      <div class="word">${esc(t.word)}</div>
      ${opts()?`<div class="sylls">${"<i></i>".repeat(t.level)}</div>`:`<span class="chip">${esc(t.cat)}</span>`}
      ${t.drawn?`<button class="btn ghost" id="shuffle" style="width:auto;padding:10px 18px">🔀 Shuffle</button>`:""}
      ${micHTML(L.uploading?"Sending…":"Tap to record",false)}${errHTML()}`,
      bind(){
        if(t.drawn) $("shuffle").onclick=()=>{ SFX.whoosh(); buzz(15); send({type:"shuffle"}); };
        const m=$("mic"); m.onclick=()=>recordInto("orig",m,async(buf,blob)=>{ L.origRev=reverseBuf(buf); L.uploading=true; orender();
          try{ await upload("orig",blob); O.err=""; SFX.rewind(); }catch(e){ O.err=e.message; } L.uploading=false; orender(); });
      } };
    // Stage 2: listen backward (needs the reversed clip; reload-safe)
    if(!L.origRev){ getClip("orig").then(c=>{ L.origRev=c.rev; orender(); }).catch(()=>{}); return { cls:"center", html: waitCard("Loading your clip…","") }; }
    if(!t.clips.copy && !O.mimic) return { cls:"center", html:`<span class="kicker">Here it is backward</span><h2 class="big-t">Listen close</h2>
      <button class="play" id="pl" ${t.sPlays?"":"disabled"} aria-label="Play backward">${ICON.rew}</button>
      <div class="pips">${Array.from({length:s.settings.speakerPlays},(_,i)=>`<i class="${i<s.settings.speakerPlays-t.sPlays?"used":""}"></i>`).join("")}</div>
      <p class="dim">${t.sPlays} listen${t.sPlays===1?"":"s"} left</p>
      <button class="btn team" id="next" ${t.sPlays<s.settings.speakerPlays?"":"disabled"}>I'VE GOT IT</button>
      <button class="link" id="redo">Redo my recording</button>`,
      bind(){
        const p=$("pl"); p.onclick=()=>{ if(!t.sPlays) return; buzz(15); send({type:"speakerListen"}); p.classList.add("spin"); p.disabled=true; play(L.origRev,()=>orender()); };
        $("next").onclick=()=>{ O.mimic=true; SFX.whoosh(); orender(); };
        $("redo").onclick=()=>{ O.mimic=false; L.origRev=null; send({type:"redoOrig"}); };
      } };
    // Stage 3: say it backward, then send
    const done=t.clips.copy;
    return { cls:"center", html:`<span class="kicker">From memory</span><h2 class="big-t">Now say it BACKWARD</h2>
      ${micHTML(L.uploading?"Sending…":done?"Recorded! Tap to redo":"Tap to record",done)}
      ${done?`<button class="btn team" id="send">SEND TO ${esc(oname(t.guesserId).toUpperCase())}</button>`:`<p class="dim">Copy the backward sounds as closely as you can.</p>`}${errHTML()}`,
      bind(){
        const m=$("mic"); m.onclick=()=>{ if(done && !activeRec) m.classList.remove("done");
          recordInto("copy",m,async(buf,blob)=>{ L.uploading=true; orender(); try{ await upload("copy",blob); O.err=""; }catch(e){ O.err=e.message; } L.uploading=false; orender(); }); };
        if(done) $("send").onclick=()=>{ SFX.go(); send({type:"send"}); };
      } };
  },
  guess(){
    const s=O.st, t=s.turn, lim=s.settings.guesserPlays, left=t.gPlays;
    if(t.guesserId!==O.pid){
      const sub = t.word ? `The word: <b>${esc(t.word)}</b>${t.guess?"":""}` : "Can you figure it out before they do?";
      return { cls:"center", html: waitCard(`${esc(oname(t.guesserId))} is guessing`, sub, t.guesserId) };
    }
    return { cls:"center", html:`<span class="kicker">You're the Guesser · ${esc(t.cat)}${opts()?` · ${t.level} syllables`:""}</span><h2 class="big-t">What did ${esc(oname(t.speakerId))} say?</h2>
      <button class="play" id="pl" ${!lim||left?"":"disabled"} aria-label="Play clip">${ICON.play}</button>
      ${lim?`<div class="pips">${Array.from({length:lim},(_,i)=>`<i class="${i<lim-left?"used":""}"></i>`).join("")}</div><p class="dim">${left} listen${left===1?"":"s"} left</p>`:`<p class="dim">Listen as much as you want</p>`}
      ${opts()?`<input class="inp" id="guess" autocomplete="off" autocapitalize="off" placeholder="Your guess" value="${esc(O.guessDraft)}" ${t.heard?"":"disabled"}>
        <button class="btn team" id="submit" ${t.heard?"":"disabled"}>FINAL ANSWER</button><button class="link" id="giveup" ${t.heard?"":"hidden"}>Give up</button>`
      :`<button class="btn team" id="reveal" ${t.heard?"":"disabled"}>REVEAL IT</button>`}${errHTML()}`,
      bind(){
        $("pl").onclick=()=>{ ac(); send({type:"listen"}); };
        if(opts()){
          const g=$("guess"); g.oninput=()=>O.guessDraft=g.value; g.onkeydown=e=>{ if(e.key==="Enter") $("submit").click(); };
          $("submit").onclick=()=>{ if(!O.guessDraft.trim()){ g.focus(); return; } SFX.drum(); send({type:"guess",text:O.guessDraft}); };
          $("giveup").onclick=()=>send({type:"giveup"});
        } else $("reveal").onclick=()=>send({type:"reveal"});
      } };
  },
  reveal(){
    const s=O.st, t=s.turn, pts_=opts(), ok=t.correct, d=t.delta, last=pts_ && s.round>s.settings.rounds;
    return { cls:"center"+(pts_&&!ok?" shake":""), html:`
      ${pts_?`<div class="stamp ${ok?"good":"bad"}">${ok?"NAILED IT":t.guess?"NOPE":"GAVE UP"}</div>`:""}
      <div class="word">${esc(t.word)}</div>
      ${pts_&&t.guess?`<p class="dim">${esc(oname(t.guesserId))} guessed “${esc(t.guess)}”</p>`:""}
      ${pts_?`<div class="delta ${ok?"good":"bad"}">${d>0?"+":"−"}${Math.abs(d)} <span style="font-size:1.1rem">${esc(s.teamNames[t.team])}</span></div>`
        :`<div class="row" style="width:100%"><button class="btn ghost" id="gotIt">${t.correct===true?"✅ ":""}Got it</button><button class="btn ghost" id="missed">${t.correct===false?"❌ ":""}Missed</button></div>`}
      <div class="card" style="width:100%;box-sizing:border-box"><span class="lbl">Hear the whole chain</span><div class="chain">
        <button class="btn ghost" id="c1">1 · Original</button><button class="btn ghost" id="c2">2 · Backward</button>
        <button class="btn ghost" id="c3">3 · Backward copy</button><button class="btn ghost" id="c4">4 · What ${esc(oname(t.guesserId))} heard</button></div>
        ${pts_?`<button class="link" id="flip">${ok?"That's wrong, mark it a miss":"Close enough? Count it"}</button>`:""}</div>
      <button class="btn" id="next">${last?"FINAL SCORES":"NEXT TURN"}</button>${!pts_?`<button class="link" id="end">End game</button>`:""}`,
      bind(){
        const pc=(k,rev)=>async()=>{ try{ const c=await getClip(k); play(rev?c.rev:c.buf); }catch(e){ O.err="Couldn't load that clip."; orender(); } };
        $("c1").onclick=pc("orig",false); $("c2").onclick=pc("orig",true); $("c3").onclick=pc("copy",false); $("c4").onclick=pc("copy",true);
        if(pts_) $("flip").onclick=()=>send({type:"mark",correct:!ok});
        else { $("gotIt").onclick=()=>{ SFX.win(); confetti(80); send({type:"mark",correct:true}); }; $("missed").onclick=()=>{ SFX.lose(); send({type:"mark",correct:false}); }; $("end").onclick=()=>send({type:"end"}); }
        $("next").onclick=()=>{ SFX.tap(); send({type:"next"}); };
      } };
  },
  final(){
    const s=O.st, [A,B]=s.scores, tie=A===B, wi=A>B?0:1, pts_=opts(), host=s.hostId===O.pid;
    const tally=i=>s.history.filter(h=>h.team===i && h.ok).length;
    return { cls:"center", html:`<div class="splash"><div style="font-size:4rem;line-height:1">🏆</div>
      <h1 class="huge">${pts_?(tie?"IT'S A TIE":esc(s.teamNames[wi])+" WINS"):"GG!"}</h1>
      <p class="d" style="font-size:1.6rem">${pts_?`${A} : ${B}`:`${esc(s.teamNames[0])} ${tally(0)} · ${esc(s.teamNames[1])} ${tally(1)}`}</p></div>
      ${host?`<button class="btn" id="again">REMATCH</button><button class="btn ghost" id="lobby">Back to lobby</button>`:`<p class="dim">Waiting for ${esc(oname(s.hostId))} to start a rematch</p>`}
      <div class="card" style="width:100%;box-sizing:border-box;text-align:left"><span class="lbl">Every turn</span>
      ${s.history.map(h=>`<p>${esc(s.teamNames[h.team])} · <b>${esc(h.word)}</b> <span class="dim">${esc(h.speaker||"")} → ${esc(h.guesser||"")}</span> ${pts_?`<span style="color:${h.d>0?"var(--good)":"var(--bad)"}">${h.d>0?"+":"−"}${Math.abs(h.d)}</span>`:(h.ok===true?"✅":h.ok===false?"❌":"")}</p>`).join("")||`<p class="dim">No turns played.</p>`}</div>`,
      bind(){ if(host){ $("again").onclick=()=>send({type:"start"}); $("lobby").onclick=()=>send({type:"lobby"}); } } };
  }
};

// Auto-open the join screen from an invite link
{ const rc=(new URLSearchParams(location.search).get("room")||"").toUpperCase();
  if(rc && ONLINE_OK){ S.screen="online"; if(/^[A-Z]{4}$/.test(rc) && O.name) connect(rc); } }
render();
loadWords();

</script>
<script>if("serviceWorker" in navigator) addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
</body></html>
