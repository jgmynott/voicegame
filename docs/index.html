<title>BackWords</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: phone-first stage. A thin bar on top, one main action per screen, centered.
   Look: white and orange, one rounded friendly font (Fredoka), flat shapes, little decoration. */
:root{
  --bg:#ffffff; --card:#f6f2ee; --ink:#1c1917; --dim:#78716c; --line:#e9e2db;
  --a:#ff6a13; --a-dk:#4e5226; --b:#1c1917; --b-dk:#4e5226; --shadow:#4e5226;
  --gold:#ff6a13; --gold-dk:#4e5226; --good:#16a34a; --good-dk:#0f7a37; --bad:#dc2626;
  --paper:#fff4ec; --paper-ink:#1c1917; --on-team:#ffffff;
  --team:var(--a); --team-dk:var(--a-dk);
  --f-d:"Fredoka","Arial Rounded MT Bold",system-ui,sans-serif;
  --f-b:"Fredoka",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
body[data-team="1"]{--team:var(--b);--team-dk:var(--b-dk)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-b);font-weight:500;font-size:17px;line-height:1.35;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 24px;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
input{user-select:text;-webkit-user-select:text}
.wrap{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
h1,h2,.d{font-family:var(--f-d);font-weight:600;margin:0;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
.dim{color:var(--dim)}
b{font-weight:600}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0 10px}
.logo{font-family:var(--f-d);font-weight:600;font-size:1.15rem;display:flex;gap:0;align-items:center;letter-spacing:-.01em}
.logo span:first-child{display:none}
.logo .w{color:var(--a)}
.scores{display:flex;align-items:center;gap:6px;font-family:var(--f-d);font-weight:600;font-size:1.1rem;font-variant-numeric:tabular-nums}
.scores .s{padding:3px 10px;border-radius:999px;min-width:2.4em;text-align:center;color:#fff}
.scores .sa{background:var(--a)} .scores .sb{background:var(--b)}
.scores .on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px currentColor}
.scores .sa.on{color:#fff;box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--a)} .scores .sb.on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--b)}
.iconbtn{width:40px;height:40px;border-radius:12px;border:none;background:var(--card);color:var(--ink);font-size:1.2rem;cursor:pointer;display:grid;place-items:center}

.stage{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;padding-block:8px;animation:enter .3s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.center{text-align:center;align-items:center}
.kicker{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:600}
.huge{font-size:clamp(2.6rem,13vw,4rem);line-height:.95}
.big-t{font-size:clamp(1.8rem,8.5vw,2.4rem);line-height:1.05}

/* buttons: flat, rounded, a small press */
.btn{font-family:var(--f-d);font-weight:600;font-size:1.3rem;border:none;border-radius:16px;padding:16px 20px;cursor:pointer;width:100%;
  background:var(--a);color:#fff;box-shadow:0 4px 0 var(--a-dk);transition:transform .06s, box-shadow .06s;letter-spacing:.01em}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--a-dk)}
.btn.team{background:var(--team);color:#fff;box-shadow:0 4px 0 var(--team-dk)}
.btn.team:active{box-shadow:0 1px 0 var(--team-dk)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:none;font-size:1.05rem;padding:13px}
.btn.ghost:active{background:var(--line)}
.btn svg{width:1.1em;height:1.1em;vertical-align:-.15em}
.btn:disabled{opacity:.35;pointer-events:none}
.link{background:none;border:none;color:var(--dim);font:500 .95rem var(--f-b);text-decoration:underline;cursor:pointer;padding:8px}
button:focus-visible,input:focus-visible{outline:3px solid var(--a);outline-offset:3px}
.row{display:flex;gap:12px}
.row>*{flex:1}

/* mic */
.micwrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.mic{--lvl:0;position:relative;width:min(52vw,190px);aspect-ratio:1;max-width:100%;border-radius:50%;border:none;cursor:pointer;color:#fff;
  background:var(--a);box-shadow:0 6px 0 var(--a-dk), 0 0 0 calc(8px + var(--lvl)*40px) color-mix(in srgb,var(--a) 18%,transparent);
  display:grid;place-items:center;transition:box-shadow .08s, transform .1s}
.mic:active{transform:translateY(4px);box-shadow:0 2px 0 var(--a-dk), 0 0 0 8px color-mix(in srgb,var(--a) 18%,transparent)}
.mic svg{width:36%;height:36%}
.mic.rec{animation:throb 1s infinite}
.mic.done{background:var(--good);box-shadow:0 6px 0 var(--good-dk)}
.mic .ring{position:absolute;inset:-14px;border-radius:50%;pointer-events:none}
@keyframes throb{50%{transform:scale(1.04)}}
.miclabel{font-family:var(--f-d);font-weight:600;font-size:1.25rem}
.timer{font-variant-numeric:tabular-nums;color:var(--dim);font-size:.95rem;height:1.2em}

/* play */
.play{position:relative;width:min(48vw,170px);aspect-ratio:1;max-width:100%;border-radius:50%;border:none;cursor:pointer;color:#fff;
  background:var(--ink);box-shadow:0 6px 0 var(--shadow);display:grid;place-items:center}
.play:active{transform:translateY(4px);box-shadow:0 2px 0 var(--shadow)}
.play svg{width:38%;height:38%}
.play.spin svg{animation:spin .8s linear infinite}
.play:disabled{opacity:.3}
@keyframes spin{to{transform:rotate(-360deg)}}
.play.sm{width:min(28vw,96px);box-shadow:0 4px 0 var(--shadow)}
.pips{display:flex;gap:10px;justify-content:center}
.pips i{width:16px;height:16px;border-radius:50%;background:var(--a);display:block}
.pips i.used{background:var(--line)}

/* word card */
.card{background:var(--card);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px}
.word{background:var(--paper);color:var(--ink);border:2px solid var(--a);border-radius:18px;padding:20px 18px;text-align:center;font-family:var(--f-d);font-weight:600;
  font-size:clamp(1.8rem,8.5vw,2.5rem);line-height:1.05;animation:pop .35s ease-out;word-break:break-word}
.word.sm{font-size:clamp(1.3rem,6.5vw,1.8rem);padding:12px 16px}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.lrow{display:flex;gap:16px;align-items:center;justify-content:center}
.lrow .dim{text-align:left;max-width:160px;margin:0}
.sylls{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.sylls i{width:12px;height:12px;border-radius:50%;background:var(--a);display:block}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:6px 14px;font-weight:600;font-size:.9rem}

/* splash */
.splash{background:var(--team);color:#fff;border-radius:24px;padding:30px 20px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;animation:pop .35s ease-out}
.who{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.who div{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.av{width:58px;height:58px;border-radius:50%;background:#fff;color:var(--team);font-family:var(--f-d);font-weight:600;font-size:1.7rem;display:grid;place-items:center}
.who span{font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.who b{font-size:1.05rem;max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* bet board */
.bets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bet{border:none;border-radius:16px;padding:14px 6px;cursor:pointer;color:#fff;font-family:var(--f-d);font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;
  box-shadow:0 4px 0 var(--shadow);animation:enter .3s backwards}
.bet:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
.bet .n{font-size:2.4rem;line-height:1}
.bet .s{font-size:.7rem;letter-spacing:.1em;opacity:.9;font-weight:500}
.bet .p{font-size:1.05rem}
.bet .m{font-size:.75rem;opacity:.85;font-weight:500}

/* inputs */
.inp{width:100%;box-sizing:border-box;font:600 1.3rem var(--f-b);padding:14px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--ink);text-align:center}
.inp:focus{border-color:var(--a);outline:none}
.sm{font-size:1rem;padding:11px;text-align:left}

/* reveal */
.stamp{font-family:var(--f-d);font-weight:700;font-size:clamp(2.4rem,12vw,3.4rem);padding:2px 16px;border:5px solid currentColor;border-radius:14px;transform:rotate(-6deg);animation:stamp .4s ease-out backwards;display:inline-block}
.stamp.good{color:var(--good)} .stamp.bad{color:var(--bad)}
@keyframes stamp{from{transform:scale(2) rotate(-6deg);opacity:0}to{transform:rotate(-6deg);opacity:1}}
.delta{font-family:var(--f-d);font-weight:600;font-size:2.8rem;animation:enter .4s .3s backwards}
.delta.good{color:var(--good)} .delta.bad{color:var(--bad)}
.drum{font-family:var(--f-d);font-weight:600;font-size:2rem;animation:wobble .18s infinite}
@keyframes wobble{50%{transform:scale(1.06) rotate(2deg)}}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.chain{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chain .btn{font-size:.95rem;padding:12px 8px}

/* title, setup */
.title{text-align:center;padding:10px 0 4px}
.title .huge{font-size:clamp(3rem,15vw,4.4rem);font-weight:700}
.title .mirror{display:block;transform:scaleX(-1);color:var(--a)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{font:500 .95rem var(--f-b);padding:9px 14px;border-radius:999px;border:none;background:#fff;color:var(--dim);cursor:pointer}
.seg button[aria-checked="true"]{background:var(--a);color:#fff}
.lbl{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:600}
.teamrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tA{border-left:5px solid var(--a);padding-left:10px;display:flex;flex-direction:column;gap:8px}
.tB{border-left:5px solid var(--b);padding-left:10px;display:flex;flex-direction:column;gap:8px}
.err{color:var(--bad);text-align:center}

/* overlay menu */
.overlay{position:fixed;inset:0;background:rgba(28,25,23,.4);z-index:20;overflow:auto;
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px))}
.overlay .card{max-width:480px;margin:0 auto;background:#fff}
.overlay ul{margin:0;padding-left:20px;font-weight:400;display:flex;flex-direction:column;gap:6px}
.tag{font-size:.65rem;color:var(--a);border:1px solid var(--a);border-radius:4px;padding:0 4px;margin-left:4px;font-weight:600}
#fx{position:fixed;inset:0;pointer-events:none;z-index:30;width:100%;height:100%}
.code{font-family:var(--f-d);font-weight:700;font-size:clamp(3.2rem,17vw,4.6rem);letter-spacing:.16em;line-height:1;color:var(--a)}
.dots{display:flex;gap:8px;justify-content:center}
.dots i{width:11px;height:11px;border-radius:50%;background:currentColor;opacity:.85;animation:bob 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bob{50%{transform:translateY(-7px);opacity:.4}}
.pl{font-weight:600;font-size:1.05rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl.off{opacity:.45}

/* daily */
.daily-cta{border:2px solid var(--a);color:var(--a);background:#fff;box-shadow:none}
.daily-cta:active{background:var(--paper)}
.drow{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:12px;background:var(--card);font-weight:600;text-align:left;width:100%;box-sizing:border-box}
.drow.no span{color:var(--bad)} .drow.ok{background:#e8f7ee} .drow.ok span{color:var(--good)}
.hint{padding:8px 14px;border-radius:12px;background:var(--paper);color:var(--ink);font-weight:500;width:100%;box-sizing:border-box;text-align:left;letter-spacing:.02em}
.fbw{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.fbw i,.legend i{font-style:normal;padding:3px 9px;border-radius:8px;font-weight:600}
.fb-g{background:var(--good);color:#fff} .fb-y{background:#f5b400;color:#1c1917} .fb-n{background:#ffd9bf;color:#1c1917} .fb-x{background:#e7e2dd;color:var(--dim)}
.heat{font-style:normal;font-size:.8rem;font-weight:600;white-space:nowrap;padding:3px 8px;border-radius:999px;background:#fff}
.heat.h3{color:var(--good)} .heat.h2{color:var(--a)} .heat.h1{color:#b45309} .heat.h0{color:var(--dim)}
.legend{font-size:.75rem;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.legend i{font-size:.75rem;padding:2px 7px}
.seg.speed{justify-content:center}
.seg.speed button{background:var(--card)}
.seg.speed button[aria-checked="true"]{background:var(--ink);color:#fff}
.dstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.dstats div{display:flex;flex-direction:column;font-size:.8rem;color:var(--dim)}
.dstats b{font-size:1.6rem;color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

// ---------- Word bank: [phrase, syllables] by category ----------

    ["Siberian husky puppy",8],["Labrador retriever puppy",8],["duck-billed platypus family",8],["Galapagos giant tortoise",8],["brachiosaurus skeleton",8]
  ],
  Food:[
    ["spaghetti",3],["pineapple",3],["lemonade",3],["cinnamon",3],["banana",3],["burrito",3],["potato",3],["tomato",3],["broccoli",3],["hamburger",3],["popsicle",3],

    ["under the weather",5],["once in a blue moon",5],["practice makes perfect",5],["there's no place like home",5],["bite the bullet now",5],
    ["hit the nail on the head",6],["the ball is in your court",6],["it takes two to tango",6],["a blessing in disguise",6],["barking up the wrong tree",6],["a penny for your thoughts",6],
    ["the elephant in the room",7],["the grass is always greener",7],["let the cat out of the bag",7],["Rome wasn't built in a day",7],["all that glitters is not gold",7],["actions speak louder than words",7],["the early bird gets the worm",7],["the squeaky wheel gets the grease",7],
    ["curiosity killed the cat",8],["don't judge a book by its cover",8],["the early bird catches the worm",8],["laughter is the best medicine",8],["biting off more than you can chew",8],["absence makes the heart grow fonder",8],["you can't teach an old dog new tricks",8]
  ]

for(const c in BANK) BANK[c]=BANK[c].filter(([w,n])=>n>=3 && n<=8);
const CATS = Object.keys(BANK);
const PTS_PER_SYL = 10;
const pointsFor = s => s * PTS_PER_SYL;
const penaltyFor = s => Math.ceil(pointsFor(s) / 2);
const MAX_REC_MS = 12000;

// Rough syllable estimate for words the other team types in
function estSyl(text){
  return text.toLowerCase().replace(/[^a-z ]/g," ").split(/\s+/).filter(Boolean).reduce((n,w)=>{
    if(w.length<=3) return n+1;
    w=w.replace(/(?:[^laeiouy]es|ed|[^laeiouy]e)$/,"").replace(/^y/,"");
    const m=w.match(/[aeiouy]{1,2}/g); return n+Math.max(1,m?m.length:1);
  },0);
}

// ---------- Audio ----------

function decode(ab){ return new Promise((res,rej)=>ac().decodeAudioData(ab,res,rej)); }
function stopPlay(){ if(playing){ const p=playing; playing=null; try{p.stop()}catch(e){} } }
function play(buf,onEnd,rate){
  stopPlay(); const c=ac(); const s=c.createBufferSource(); s.buffer=buf; if(rate) s.playbackRate.value=rate; s.connect(c.destination);
  s.onended=()=>{ if(playing===s){ playing=null; onEnd&&onEnd(); } }; s.start(); playing=s;
}
function reverseBuf(buf){
  const out=ac().createBuffer(buf.numberOfChannels,buf.length,buf.sampleRate);
  for(let ch=0;ch<buf.numberOfChannels;ch++){ const a=buf.getChannelData(ch), b=out.getChannelData(ch), n=a.length; for(let i=0;i<n;i++) b[i]=a[n-1-i]; }
  return out;
}
// Clean a recording: band-pass to the voice range (cuts rumble, hum and hiss),
// then a soft noise gate that quiets the gaps between words down to near silence.
async function cleanBuf(buf){
  try{
    const sr=buf.sampleRate, n=buf.length;
    const off=new OfflineAudioContext(1,n,sr), src=off.createBufferSource(); src.buffer=buf;
    const hp=off.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=110; hp.Q.value=0.7;
    const hp2=off.createBiquadFilter(); hp2.type="highpass"; hp2.frequency.value=110; hp2.Q.value=0.7;
    const lp=off.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=7000; lp.Q.value=0.7;
    src.connect(hp); hp.connect(hp2); hp2.connect(lp); lp.connect(off.destination); src.start();
    const out=await off.startRendering(), d=out.getChannelData(0);
    const fr=Math.max(64,Math.round(sr*0.02)), nf=Math.ceil(n/fr), rms=new Float32Array(nf);
    for(let f=0;f<nf;f++){ let s=0; const a=f*fr, b=Math.min(n,a+fr); for(let i=a;i<b;i++) s+=d[i]*d[i]; rms[f]=Math.sqrt(s/Math.max(1,b-a)); }
    const sorted=Array.from(rms).sort((x,y)=>x-y), floor=sorted[Math.floor(nf*0.15)]||0, peak=sorted[nf-1]||0;
    if(peak>floor*4){
      const open=Math.max(floor*3, peak*0.06), shut=open*0.6;
      const g=new Float32Array(nf); let on=false, hold=0;
      for(let f=0;f<nf;f++){ if(rms[f]>open){ on=true; hold=8; } else if(rms[f]<shut){ if(hold>0) hold--; else on=false; } g[f]=on?1:0.06; }
      for(let f=1;f<nf;f++) g[f]=Math.max(g[f], g[f-1]*0.7);           // release
      for(let f=nf-2;f>=0;f--) g[f]=Math.max(g[f], g[f+1]*0.6);        // attack, so word starts aren't clipped
      let mx=0;
      for(let i=0;i<n;i++){ const f=i/fr, k=Math.min(nf-1,Math.floor(f)), k2=Math.min(nf-1,k+1), t=f-k; d[i]*= g[k]*(1-t)+g[k2]*t; const v=Math.abs(d[i]); if(v>mx) mx=v; }
      if(mx>0 && mx<0.7){ const s=0.7/mx; for(let i=0;i<n;i++) d[i]*=s; }
    }
    return out;
  }catch(e){ return buf; }
}
// Slow speech down without dropping the pitch (WSOLA time-stretch). rate<1 is slower.
function stretchBuf(buf,rate){
  if(!rate || rate>=0.99) return buf;
  const sr=buf.sampleRate, x=buf.getChannelData(0), N=Math.round(sr*0.046), H=N>>1, tol=Math.round(sr*0.012);
  const outLen=Math.ceil(x.length/rate)+N, y=new Float32Array(outLen), wsum=new Float32Array(outLen);
  const win=new Float32Array(N); for(let i=0;i<N;i++) win[i]=0.5-0.5*Math.cos(2*Math.PI*i/(N-1));
  let prev=0, o=0;
  for(;;o+=H){
    const center=Math.round(o*rate); if(center+N+tol>=x.length) break;
    let best=center;
    if(o>0){ const nat=prev+H; let bestC=-Infinity;
      for(let k=-tol;k<=tol;k+=2){ const p=center+k; if(p<0||p+N>=x.length) continue; let c=0; for(let i=0;i<N;i+=4) c+=x[p+i]*x[nat+i]; if(c>bestC){ bestC=c; best=p; } } }
    for(let i=0;i<N;i++){ y[o+i]+=x[best+i]*win[i]; wsum[o+i]+=win[i]; }
    prev=best;
  }
  const len=Math.min(outLen,o+N), out=ac().createBuffer(1,len,sr), z=out.getChannelData(0);
  for(let i=0;i<len;i++) z[i]=wsum[i]>1e-3?y[i]/wsum[i]:0;
  return out;
}
function trimBuf(buf){
  const d=buf.getChannelData(0); let peak=0; for(let i=0;i<d.length;i++){ const v=Math.abs(d[i]); if(v>peak) peak=v; }
  const th=Math.max(0.015,peak*0.06); let st=0, en=d.length-1;
  while(st<d.length && Math.abs(d[st])<th) st++;
  while(en>st && Math.abs(d[en])<th) en--;
  const pad=Math.floor(buf.sampleRate*0.08); st=Math.max(0,st-pad); en=Math.min(d.length-1,en+pad);
  if(en-st < buf.sampleRate*0.2) return buf;
  const out=ac().createBuffer(buf.numberOfChannels,en-st+1,buf.sampleRate);
  for(let ch=0;ch<buf.numberOfChannels;ch++) out.getChannelData(ch).set(buf.getChannelData(ch).subarray(st,en+1));
  return out;
}
async function getStream(){
  if(stream && stream.active) return stream;
  // Ask the phone for its voice processing: noise suppression, echo cancellation, auto gain, mono.
  // voiceIsolation is used where the browser supports it (newer Chrome); others ignore it.
  const want={echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1,voiceIsolation:true};
  try{ stream = await navigator.mediaDevices.getUserMedia({audio:want}); }
  catch(e){ stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}); }
  return stream;
}
let activeRec=null;
async function startRec(onDone,onFail){
  ac();
  try{
    const s=await getStream(); const chunks=[]; const mr=new MediaRecorder(s);
    mr.ondataavailable=e=>{ if(e.data && e.data.size) chunks.push(e.data); };
    mr.onstop=async()=>{
      clearTimeout(mr._t); activeRec=null;
      try{ const blob=new Blob(chunks,{type:mr.mimeType||"audio/webm"}); const buf=await decode(await blob.arrayBuffer()); onDone(trimBuf(buf)); }
      catch(e){ onFail("Could not read that recording. Try again."); }
    };
    mr.start(); mr._t=setTimeout(()=>{ if(mr.state==="recording") mr.stop(); },MAX_REC_MS);
    activeRec=mr; return true;
  }catch(e){ micBlocked=true; onFail(null); return false; }
}
function stopRec(){ if(activeRec && activeRec.state==="recording") activeRec.stop(); }
async function fileToBuf(file){ ac(); return trimBuf(await decode(await file.arrayBuffer())); }

function drawWave(canvas,buf,color){
  const dpr=window.devicePixelRatio||1, w=canvas.clientWidth, h=canvas.clientHeight;
  canvas.width=w*dpr; canvas.height=h*dpr; const g=canvas.getContext("2d"); g.scale(dpr,dpr);
  const d=buf.getChannelData(0), bars=Math.max(20,Math.floor(w/4)), step=Math.floor(d.length/bars)||1;
  let max=0; const vals=[];
  for(let i=0;i<bars;i++){ let m=0; for(let j=i*step;j<(i+1)*step && j<d.length;j+=4){ const v=Math.abs(d[j]); if(v>m) m=v; } vals.push(m); if(m>max) max=m; }
  g.fillStyle=color;
  vals.forEach((v,i)=>{ const bh=Math.max(2,(v/(max||1))*(h-12)); g.fillRect(i*(w/bars)+1,(h-bh)/2,Math.max(1,w/bars-2),bh); });
}

let DECKS={}; try{ DECKS=JSON.parse(localStorage.getItem("rvg-decks")||"{}"); }catch(e){}
function rng(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function deckList(cat,level){ return BANK[cat].filter(([w,n])=>level==null || n===level); }
function drawFrom(key,list){
  let d=DECKS[key]; if(!d || d.n!==list.length || d.pos>=list.length) d=DECKS[key]={seed:(Math.random()*2**31)|0,pos:0,n:list.length};
  const r=rng(d.seed), order=list.map((_,i)=>i);
  for(let i=order.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [order[i],order[j]]=[order[j],order[i]]; }
  const item=list[order[d.pos++]]; try{ localStorage.setItem("rvg-decks",JSON.stringify(DECKS)); }catch(e){}
  return item;
}
function drawWord(cat,level){
  let list=deckList(cat,level), key=cat+"|"+(level??"any"), fellBack=false;
  if(!list.length){ list=CATS.flatMap(c=>deckList(c,level)); key="all|"+level; fellBack=true; }
  const [w,n]=drawFrom(key,list); return {word:w,syl:n,fellBack,drawn:true};
}

const norm = s => s.toLowerCase().replace(/[’']/g,"").replace(/[^a-z0-9 ]+/g," ").replace(/\b(a|an|the)\b/g," ").replace(/\s+/g," ").trim();
function lev(a,b){ const m=a.length,n=b.length; const d=Array.from({length:m+1},(_,i)=>[i]); for(let j=1;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++) d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return d[m][n]; }
function judge(guess,answer){ const g=norm(guess), a=norm(answer); if(!g) return false; if(g===a || g.replace(/ /g,"")===a.replace(/ /g,"")) return true; return lev(g,a) <= Math.max(1,Math.floor(a.length/10)); }

function tone(f,dur,type="sine",vol=.15,when=0,to){
  if(S.muted) return; const c=ac(), t=c.currentTime+when, o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t); if(to) o.frequency.exponentialRampToValueAtTime(to,t+dur);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.012); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+.03);
}
let noiseBuf=null;
function noise(dur,vol,when=0,f0=1000,f1){
  if(S.muted) return; const c=ac();
  if(!noiseBuf){ noiseBuf=c.createBuffer(1,c.sampleRate,c.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
  const t=c.currentTime+when, s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain();
  s.buffer=noiseBuf; f.type="bandpass"; f.Q.value=1.2; f.frequency.setValueAtTime(f0,t); if(f1) f.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f); f.connect(g); g.connect(c.destination); s.start(t); s.stop(t+dur+.02);
}

// ---------- confetti ----------
const fx=document.getElementById("fx"), fxg=fx.getContext("2d"); let parts=[], fxOn=false;
function confetti(n=140){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const w=innerWidth, cols=["#ff6a13","#ff9a52","#1c1917","#ffc49a","#cc4f05","#78716c"];
  for(let i=0;i<n;i++) parts.push({x:w/2+(Math.random()-.5)*80,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*15-5,r:Math.random()*6+4,c:cols[i%cols.length],a:Math.random()*6,va:(Math.random()-.5)*.4,life:120+Math.random()*60});
  if(!fxOn){ fxOn=true; requestAnimationFrame(tickFx); }
}
function tickFx(){
  const dpr=devicePixelRatio||1; if(fx.width!==innerWidth*dpr){ fx.width=innerWidth*dpr; fx.height=innerHeight*dpr; }
  fxg.setTransform(dpr,0,0,dpr,0,0); fxg.clearRect(0,0,innerWidth,innerHeight);
  parts.forEach(p=>{ p.vy+=.45; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.a+=p.va; p.life--; fxg.save(); fxg.translate(p.x,p.y); fxg.rotate(p.a); fxg.fillStyle=p.c; fxg.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); fxg.restore(); });
  parts=parts.filter(p=>p.life>0 && p.y<innerHeight+40);
  if(parts.length) requestAnimationFrame(tickFx); else { fxOn=false; fxg.clearRect(0,0,innerWidth,innerHeight); }
}

let analyser=null, meterRaf=0, recTimer=0, recStart=0;
async function ensureMic(){
  try{ await getStream(); S.micError=""; return true; }
  catch(e){ let framed=false; try{ framed=window.top!==window.self; }catch(_){ framed=true; }
    S.micError = framed ? "The mic is blocked in this preview. Open the game from its own app link to record." : location.protocol==="https:"||location.hostname==="localhost" ? "Microphone blocked. Allow mic access for this site in your browser settings, then reload." : "This page needs to be opened from its https link to use the mic."; return false; }
}
async function recordInto(key,btn,onDone){
  if(activeRec){ stopRec(); return; }
  stopPlay();
  if(!(await ensureMic())){ render(); return; }
  SFX.recOn(); buzz(30);
  await new Promise(r=>setTimeout(r,180));
  const s=await getStream(); const chunks=[]; let mr;
  try{ mr=new MediaRecorder(s); }catch(e){ S.micError="Recording is not supported in this browser."; render(); return; }
  mr.ondataavailable=e=>{ if(e.data && e.data.size) chunks.push(e.data); };
  mr.onstop=async()=>{
    clearTimeout(mr._t); cancelAnimationFrame(meterRaf); clearInterval(recTimer); activeRec=null;
    SFX.recOff(); buzz(20);
    try{ const blob=new Blob(chunks,{type:mr.mimeType||"audio/mp4"}); const buf=trimBuf(await cleanBuf(await decode(await blob.arrayBuffer()))); S.turn[key]=buf; onDone(buf,blob); }
    catch(e){ S.micError="Could not read that recording. Try again."; render(); }
  };
  mr.start(); activeRec=mr; recStart=Date.now();
  mr._t=setTimeout(()=>{ if(mr.state==="recording") mr.stop(); },REC_LIMIT);
  btn.classList.add("rec"); btn.innerHTML=ICON.stop;
  const lbl=document.getElementById("micLbl"), tm=document.getElementById("micTimer");
  if(lbl) lbl.textContent="Tap to stop";
  recTimer=setInterval(()=>{ if(tm) tm.textContent=((Date.now()-recStart)/1000).toFixed(1)+"s"; },100);
  try{
    const c=ac(); if(!analyser || analyser._s!==s){ analyser=c.createAnalyser(); analyser.fftSize=512; c.createMediaStreamSource(s).connect(analyser); analyser._s=s; }
    const data=new Uint8Array(analyser.fftSize);
    const loop=()=>{ analyser.getByteTimeDomainData(data); let m=0; for(const v of data){ const d=Math.abs(v-128)/128; if(d>m) m=d; } btn.style.setProperty("--lvl",Math.min(1,m*1.8).toFixed(2)); meterRaf=requestAnimationFrame(loop); };
    loop();
  }catch(e){}
}

// ---------- Daily BackWord: one word a day, same for everyone ----------
const D = { speed:(()=>{ try{ const v=+localStorage.getItem("bw-speed2"); return [1,0.7,0.5].includes(v)?v:0.7; }catch(e){ return 0.7; } })(), info:null, rev:null, fwd:null, err:"", loading:false, busy:false, draft:"", local:{}, listens:0, copied:false };
const DKEY="bw-daily", DSTATS="bw-daily-stats";
const dload = (k,d) => { try{ return JSON.parse(localStorage.getItem(k)) || d; }catch(e){ return d; } };
const dsave = (k,v) => { try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} };
function dstate(){ const s=dload(DKEY,null); return s && D.info && s.n===D.info.n ? s : { n:D.info?D.info.n:0, guesses:[], hints:[], misses:0, over:false, won:false, word:"", listens:0 }; }

async function openDaily(){
  S.turn = D.local; D.err=""; go("daily","whoosh");
  if(D.info && D.rev && D.info.date===todayNY()) return;
  D.loading=true; D.rev=null; D.fwd=null; render();
  try{
    const r=await fetch("/api/daily",{cache:"no-store"}); if(!r.ok) throw new Error("Could not load today's word.");
    D.info=await r.json();
    const a=await fetch("/api/daily/audio"); if(!a.ok) throw new Error("Today's clip isn't ready yet. Try again in a minute.");
    const buf=trimBuf(await decode(await a.arrayBuffer()));
    D.fwd=buf; D.rev=reverseBuf(buf);
  }catch(e){ D.err=e.message||"Something went wrong."; }
  D.loading=false; if(S.screen==="daily") render();
}
const todayNY = () => { try{ return new Intl.DateTimeFormat("en-CA",{timeZone:"America/New_York"}).format(new Date()); }catch(e){ return ""; } };
function untilNext(){
  try{
    const p=new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",hour:"numeric",minute:"numeric",hourCycle:"h23"}).formatToParts(new Date());
    const h=+p.find(x=>x.type==="hour").value, m=+p.find(x=>x.type==="minute").value, left=24*60-(h*60+m);
    return `${Math.floor(left/60)}h ${left%60}m`;
  }catch(e){ return "tomorrow"; }
}
async function dailyGuess(text){
  const st=dstate(); if(st.over || D.busy || !text.trim()) return;
  D.busy=true; render();
  try{
    const r=await fetch("/api/daily/guess",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({n:D.info.n,guess:text,misses:st.misses})});
    if(r.status===409){ D.info=null; D.busy=false; openDaily(); return; }
    const j=await r.json();
    st.guesses.push({ text:text.trim(), ok:j.correct, fb:j.fb }); st.hints=j.hints; st.misses=j.misses; st.listens=D.listens||st.listens;
    if(j.over){ st.over=true; st.won=j.correct; st.word=j.word;
      const s=dstats(); s.played++; if(j.correct){ s.wins++; s.streak = s.lastWin===D.info.n-1 ? s.streak+1 : 1; s.best=Math.max(s.best,s.streak); s.lastWin=D.info.n; } else s.streak=0; s.lastPlayed=D.info.n; dsave(DSTATS,s);
      if(j.correct){ SFX.win(); confetti(); buzz([40,60,40]); } else { SFX.lose(); buzz(200); }
    } else { SFX.lose(); buzz(80); }
    dsave(DKEY,st); D.draft="";
  }catch(e){ D.err="Could not check that guess. Try again."; }
  D.busy=false; render();
}
function shareText(st){
  const sq = st.guesses.map(g=>g.ok?"🟩":"🟥").join("");
  return `BackWords Daily #${D.info.n} ${st.won?st.guesses.length:"X"}/${D.info.maxGuesses}\n${sq}  🔁${st.listens||D.listens}\n${location.origin}`;
}

VIEWS.daily = function(){
  if(D.loading || (!D.info && !D.err)) return { cls:"center", html:`<span class="kicker">Daily BackWord</span><h2 class="big-t">Loading today's word…</h2><div class="dots"><i></i><i></i><i></i></div>` };
  if(D.err && !D.rev) return { cls:"center", html:`<span class="kicker">Daily BackWord</span><p class="err">${esc(D.err)}</p><button class="btn" id="retry">TRY AGAIN</button><button class="link" id="home">Back</button>`,
    bind(){ $("retry").onclick=()=>{ D.info=null; openDaily(); }; $("home").onclick=()=>go("title"); } };
  const st=dstate(), max=D.info.maxGuesses, left=max-st.guesses.length;
  if(!st.listens && D.listens) st.listens=D.listens;

  const legend = st.guesses.some(g=>g.fb) && !st.over ? `<p class="dim legend"><i class="fb-g">right spot</i> <i class="fb-y">wrong spot</i> <i class="fb-n">almost</i> <i class="fb-x">not in it</i></p>` : "";

  if(st.over){
    const s=dstats();
    return { cls:"center", html:`<span class="kicker">Daily BackWord #${D.info.n}</span>
      <h2 class="big-t">${st.won?(st.guesses.length===1?"First try!":"Got it!"):"Not today"}</h2>
      <div class="word sm">${esc(st.word)}</div>
      <div class="lrow"><button class="play sm" id="fwd" aria-label="Play forward">${ICON.play}</button><button class="play sm" id="pl" aria-label="Play backward">${ICON.rew}</button></div>
      <div class="dstats"><div><b>${s.played}</b>Played</div><div><b>${s.played?Math.round(100*s.wins/s.played):0}%</b>Won</div><div><b>${s.streak}</b>Streak</div><div><b>${s.best}</b>Best</div></div>
      <button class="btn" id="share">${D.copied?"COPIED!":"SHARE RESULT"}</button>
      <p class="dim">Next word in ${untilNext()}</p>
      <button class="link" id="home">Back to menu</button>`,
      bind(){

        $("pl").onclick=()=>{ const s=atSpeed("rev"); if(s) play(s); };
        $("share").onclick=async()=>{ const t=shareText(st);
          try{ if(navigator.share){ await navigator.share({text:t}); return; } }catch(e){ return; }
          try{ await navigator.clipboard.writeText(t); D.copied=true; render(); setTimeout(()=>{ D.copied=false; if(S.screen==="daily") render(); },1600); }catch(e){} };
        $("home").onclick=()=>go("title");
      } };
  }
  const L=D.local, mine=L.mine;
  return { cls:"center", html:`<span class="kicker">Daily BackWord #${D.info.n} · ${esc(D.info.cat)}</span>
    <div class="lrow"><button class="play sm" id="pl" aria-label="Play backward">${ICON.rew}</button><p class="dim">Today's word, played backward. Listen as much as you want.</p></div>
    ${speedSeg()}
    <div class="row" style="gap:10px"><button class="btn ghost" id="rec">${activeRec?"■ Stop":"🎙 Say it back"}</button><button class="btn ghost" id="flip" ${mine?"":"disabled"}>🔄 Flip mine</button></div>
    <p class="dim" style="margin:0">Copy the backward sound, then flip your copy to hear the real word.</p>
    ${rows}${legend}${hints}
    <input class="inp" id="dg" autocomplete="off" autocapitalize="off" placeholder="Your guess" value="${esc(D.draft)}">
    <button class="btn" id="go" ${D.busy?"disabled":""}>${D.busy?"CHECKING…":`GUESS · ${left} LEFT`}</button>
    ${D.err?`<p class="err">${esc(D.err)}</p>`:""}`,
    bind(){
      const p=$("pl"); p.onclick=()=>{ if(activeRec) return; D.listens++; buzz(15); p.classList.add("spin"); play(atSpeed("rev"),()=>p.classList.remove("spin")); };
      bindSpeed();
      const r=$("rec"); r.onclick=()=>recordInto("rec",r,buf=>{ L.mine=reverseBuf(buf); render(); });
      if(mine) $("flip").onclick=()=>{ if(activeRec) return; buzz(10); play(L.mine); };
      const g=$("dg"); g.oninput=()=>D.draft=g.value; g.onkeydown=e=>{ if(e.key==="Enter") $("go").click(); };
      $("go").onclick=()=>{ if(!D.draft.trim()){ g.focus(); return; } D.err=""; dailyGuess(D.draft); };
    } };
};

const SPEEDS=[[1,"Normal"],[0.7,"Slow"],[0.5,"Slower"]];
const SCACHE={};
function atSpeed(which){ const base=which==="fwd"?D.fwd:D.rev; if(!base) return null; const k=which+D.speed+"|"+(D.info&&D.info.n);
  if(!SCACHE[k]) SCACHE[k]=stretchBuf(base,D.speed); return SCACHE[k]; }
function speedSeg(){ return `<div class="seg speed" id="speed" role="radiogroup" aria-label="Playback speed">${SPEEDS.map(([v,l])=>`<button type="button" role="radio" aria-checked="${v===D.speed}" data-v="${v}">${l}</button>`).join("")}</div>`; }
function bindSpeed(){ const el=$("speed"); if(!el) return; el.querySelectorAll("button").forEach(b=>b.onclick=()=>{ SFX.tap(); D.speed=+b.dataset.v; try{ localStorage.setItem("bw-speed2",D.speed); }catch(e){} render(); const s=atSpeed("rev"); if(s) play(s); }); }

// ================= Online mode: every player on their own phone =================
const O = { ws:null, st:null, code:"", pid:"", name:"", err:"", clips:{}, local:{}, mimic:false, lastReveal:0, retry:0, closed:false, pickDraft:"", guessDraft:"" };
try{ O.pid = localStorage.getItem("rvg-pid") || ""; O.name = localStorage.getItem("rvg-name") || ""; }catch(e){}
if(!O.pid){ O.pid = Math.random().toString(36).slice(2,12)+Date.now().toString(36); try{ localStorage.setItem("rvg-pid",O.pid); }catch(e){} }
const ONLINE_OK = location.protocol.startsWith("http") && !/claudeusercontent|claude\.ai/.test(location.hostname);

const ost = () => O.st;
const oturn = () => O.st && O.st.turn;
const oname = id => (O.st && O.st.players[id] && O.st.players[id].name) || "Someone";
const omyTeam = () => O.st && O.st.players[O.pid] ? O.st.players[O.pid].team : 0;
const opts = () => O.st && O.st.settings.mode === "points";
const send = m => { try{ O.ws && O.ws.readyState===1 && O.ws.send(JSON.stringify(m)); }catch(e){} };
function onlineTeamColor(){
  const s=O.st; if(!s) return 0;
  if(["lobby"].includes(s.phase)) return omyTeam();
  if(s.phase==="pick") return 1-s.turn.team;
  if(s.turn) return s.turn.team;
  return omyTeam();
}
function newCode(){ const A="BCDFGHJKLMNPQRSTVWXZ"; let c=""; for(let i=0;i<4;i++) c+=A[Math.floor(Math.random()*A.length)]; return c; }

function connect(code){
  O.code = code; O.closed=false; O.err="";
  try{ history.replaceState(null,"","?room="+code); }catch(e){}
  const ws = new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/api/room/"+code+"/ws?pid="+encodeURIComponent(O.pid));
  O.ws = ws;
  ws.onopen = ()=>{ O.retry=0; send({type:"hello", name:O.name}); };
  ws.onmessage = ev => {
    let m; try{ m=JSON.parse(ev.data); }catch(e){ return; }
    if(m.type==="state"){ const prev=O.st; O.st=m.state; onState(prev); }
    else if(m.type==="play"){ playGuesserClip(); }
    else if(m.type==="error"){ O.err=m.message; orender(); }
  };
  ws.onclose = ()=>{ if(O.closed) return; O.retry++; setTimeout(()=>{ if(!O.closed) connect(O.code); }, Math.min(5000, 500*O.retry)); };
}
function leaveRoom(){ O.closed=true; try{ O.ws && O.ws.close(); }catch(e){} O.ws=null; O.st=null; O.clips={}; O.local={}; try{ history.replaceState(null,"",location.pathname); }catch(e){} }

async function getClip(kind){
  const key=kind+":"+O.st.clipVer;
  if(O.clips[key]) return O.clips[key];
  const r = await fetch("/api/room/"+O.code+"/clip/"+kind,{cache:"no-store"});
  if(!r.ok) throw new Error("clip "+r.status);
  const buf = trimBuf(await cleanBuf(await decode(await r.arrayBuffer())));
  const v = {buf, rev:reverseBuf(buf)}; O.clips[key]=v; return v;
}
async function upload(kind, blob){
  const r = await fetch("/api/room/"+O.code+"/clip/"+kind+"?pid="+encodeURIComponent(O.pid),{method:"PUT",body:blob,headers:{"Content-Type":blob.type||"audio/webm"}});
  if(!r.ok) throw new Error("Upload failed ("+r.status+")");
}
async function playGuesserClip(){
  try{ const c=await getClip("copy"); SFX.tap(); play(c.rev,()=>orender()); const b=$("pl"); if(b){ b.classList.add("spin"); b.disabled=true; } }
  catch(e){ O.err="Couldn't load the clip. Check your connection."; orender(); }
}

// Re-render without cutting off audio or a recording in progress, and keep typing focus.
let pendingRender=false;
function orender(){
  if(S.screen!=="online") return;
  if(activeRec){ pendingRender=true; return; }
  const f=document.activeElement, fid=f&&f.id, sel=f&&f.selectionStart;
  KEEP_AUDIO=true; render(); KEEP_AUDIO=false;
  if(fid){ const el=$(fid); if(el && el.tagName==="INPUT"){ el.focus(); try{ el.setSelectionRange(sel,sel); }catch(e){} } }
}
function onState(prev){
  const s=O.st, t=s.turn;
  // new turn: clear local recordings
  if(!prev || !prev.turn || !t || prev.turn.n!==t.n){ O.local={}; O.mimic=false; O.pickDraft=""; O.guessDraft=""; }
  if(prev && prev.phase!==s.phase){
    if(s.phase==="bet"||s.phase==="pick") SFX.slam();
    if(s.phase==="speak"||s.phase==="guess") SFX.whoosh();
    if(s.phase==="guess" && t.guesserId===O.pid) buzz([40,40,40]);
    if(s.phase==="final"){ SFX.fanfare(); setTimeout(()=>confetti(220),200); }
  }
  if(s.phase==="reveal" && t && O.lastReveal!==t.n && prev){
    O.lastReveal=t.n; SFX.slam();
    if(s.settings.mode==="points"){ if(t.correct){ setTimeout(()=>{SFX.win();confetti();buzz(60);},150); } else setTimeout(()=>{SFX.lose();buzz([80,60,80]);},150); }
  }
  if(s.phase==="guess" && t.guesserId===O.pid) getClip("copy").catch(()=>{});
  if(s.phase==="reveal") { getClip("orig").catch(()=>{}); getClip("copy").catch(()=>{}); }
  orender();
}

      ${micHTML(L.uploading?"Sending…":"Tap to record",false)}${errHTML()}`,
      bind(){
        if(t.drawn) $("shuffle").onclick=()=>{ SFX.whoosh(); buzz(15); send({type:"shuffle"}); };
        const m=$("mic"); m.onclick=()=>recordInto("orig",m,async(buf,blob)=>{ L.origRev=reverseBuf(buf); L.uploading=true; orender();
          try{ await upload("orig",blob); O.err=""; SFX.rewind(); }catch(e){ O.err=e.message; } L.uploading=false; orender(); });
      } };
    // Stage 2: hear it backward (unlimited) and record the backward copy on one screen
    if(!L.origRev){ getClip("orig").then(c=>{ L.origRev=c.rev; orender(); }).catch(()=>{}); return { cls:"center", html: waitCard("Loading your clip…","") }; }
    const done=t.clips.copy;
    return { cls:"center", html:`<span class="kicker">You're the Speaker · now say it BACKWARD</span>
      <div class="word sm">${esc(t.word)}</div>
      <div class="lrow"><button class="play sm" id="pl" aria-label="Play backward">${ICON.rew}</button><p class="dim">Tap to hear it backward. Listen as many times as you want.</p></div>
      ${micHTML(L.uploading?"Sending…":done?"Recorded! Tap to redo":"Tap to record your backward version",done)}
      ${done&&L.copy?`<button class="btn ghost" id="mine">▶ Hear my take</button>`:""}
      ${done?`<button class="btn team" id="send">SEND TO ${esc(oname(t.guesserId).toUpperCase())}</button>`:""}
      <button class="link" id="redo">Redo the normal recording</button>${errHTML()}`,
      bind(){
        const p=$("pl"); p.onclick=()=>{ if(activeRec) return; buzz(15); p.classList.add("spin"); play(L.origRev,()=>p.classList.remove("spin")); };
        const m=$("mic"); m.onclick=()=>{ if(done && !activeRec) m.classList.remove("done");
          recordInto("copy",m,async(buf,blob)=>{ L.uploading=true; orender(); try{ await upload("copy",blob); O.err=""; }catch(e){ O.err=e.message; } L.uploading=false; orender(); }); };
        if(done && L.copy) $("mine").onclick=()=>{ if(activeRec) return; buzz(10); play(L.copy); };
        if(done) $("send").onclick=()=>{ SFX.go(); send({type:"send"}); };
        $("redo").onclick=()=>{ L.origRev=null; L.copy=null; send({type:"redoOrig"}); };
      } };
  },
  guess(){
    const s=O.st, t=s.turn, lim=s.settings.guesserPlays, left=t.gPlays;
    if(t.guesserId!==O.pid){
      const sub = t.word ? `The word: <b>${esc(t.word)}</b>${t.guess?"":""}` : "Can you figure it out before they do?";
      return { cls:"center", html: waitCard(`${esc(oname(t.guesserId))} is guessing`, sub, t.guesserId) };
    }
    return { cls:"center", html:`<span class="kicker">You're the Guesser · ${esc(t.cat)}${opts()?` · ${t.level} syllables`:""}</span><h2 class="big-t">What did ${esc(oname(t.speakerId))} say?</h2>
      <button class="play" id="pl" ${!lim||left?"":"disabled"} aria-label="Play clip">${ICON.play}</button>
      ${lim?`<div class="pips">${Array.from({length:lim},(_,i)=>`<i class="${i<lim-left?"used":""}"></i>`).join("")}</div><p class="dim">${left} listen${left===1?"":"s"} left</p>`:`<p class="dim">Listen as much as you want</p>`}
      ${opts()?`<input class="inp" id="guess" autocomplete="off" autocapitalize="off" placeholder="Your guess" value="${esc(O.guessDraft)}" ${t.heard?"":"disabled"}>
        <button class="btn team" id="submit" ${t.heard?"":"disabled"}>FINAL ANSWER</button><button class="link" id="giveup" ${t.heard?"":"hidden"}>Give up</button>`
      :`<button class="btn team" id="reveal" ${t.heard?"":"disabled"}>REVEAL IT</button>`}${errHTML()}`,
      bind(){
        $("pl").onclick=()=>{ ac(); send({type:"listen"}); };
        if(opts()){
          const g=$("guess"); g.oninput=()=>O.guessDraft=g.value; g.onkeydown=e=>{ if(e.key==="Enter") $("submit").click(); };
          $("submit").onclick=()=>{ if(!O.guessDraft.trim()){ g.focus(); return; } SFX.drum(); send({type:"guess",text:O.guessDraft}); };
          $("giveup").onclick=()=>send({type:"giveup"});
        } else $("reveal").onclick=()=>send({type:"reveal"});
      } };
  },
  reveal(){
    const s=O.st, t=s.turn, pts_=opts(), ok=t.correct, d=t.delta, last=pts_ && s.round>s.settings.rounds;
    return { cls:"center"+(pts_&&!ok?" shake":""), html:`
      ${pts_?`<div class="stamp ${ok?"good":"bad"}">${ok?"NAILED IT":t.guess?"NOPE":"GAVE UP"}</div>`:""}
      <div class="word">${esc(t.word)}</div>
      ${pts_&&t.guess?`<p class="dim">${esc(oname(t.guesserId))} guessed “${esc(t.guess)}”</p>`:""}
      ${pts_?`<div class="delta ${ok?"good":"bad"}">${d>0?"+":"−"}${Math.abs(d)} <span style="font-size:1.1rem">${esc(s.teamNames[t.team])}</span></div>`
        :`<div class="row" style="width:100%"><button class="btn ghost" id="gotIt">${t.correct===true?"✅ ":""}Got it</button><button class="btn ghost" id="missed">${t.correct===false?"❌ ":""}Missed</button></div>`}
      <div class="card" style="width:100%;box-sizing:border-box"><span class="lbl">Hear the whole chain</span><div class="chain">
        <button class="btn ghost" id="c1">1 · Original</button><button class="btn ghost" id="c2">2 · Backward</button>
        <button class="btn ghost" id="c3">3 · Backward copy</button><button class="btn ghost" id="c4">4 · What ${esc(oname(t.guesserId))} heard</button></div>
        ${pts_?`<button class="link" id="flip">${ok?"That's wrong, mark it a miss":"Close enough? Count it"}</button>`:""}</div>
      <button class="btn" id="next">${last?"FINAL SCORES":"NEXT TURN"}</button>${!pts_?`<button class="link" id="end">End game</button>`:""}`,
      bind(){
        const pc=(k,rev)=>async()=>{ try{ const c=await getClip(k); play(rev?c.rev:c.buf); }catch(e){ O.err="Couldn't load that clip."; orender(); } };
        $("c1").onclick=pc("orig",false); $("c2").onclick=pc("orig",true); $("c3").onclick=pc("copy",false); $("c4").onclick=pc("copy",true);
        if(pts_) $("flip").onclick=()=>send({type:"mark",correct:!ok});
        else { $("gotIt").onclick=()=>{ SFX.win(); confetti(80); send({type:"mark",correct:true}); }; $("missed").onclick=()=>{ SFX.lose(); send({type:"mark",correct:false}); }; $("end").onclick=()=>send({type:"end"}); }
        $("next").onclick=()=>{ SFX.tap(); send({type:"next"}); };
      } };
  },
  final(){
    const s=O.st, [A,B]=s.scores, tie=A===B, wi=A>B?0:1, pts_=opts(), host=s.hostId===O.pid;
    const tally=i=>s.history.filter(h=>h.team===i && h.ok).length;
    return { cls:"center", html:`<div class="splash"><div style="font-size:4rem;line-height:1">🏆</div>
      <h1 class="huge">${pts_?(tie?"IT'S A TIE":esc(s.teamNames[wi])+" WINS"):"GG!"}</h1>
      <p class="d" style="font-size:1.6rem">${pts_?`${A} : ${B}`:`${esc(s.teamNames[0])} ${tally(0)} · ${esc(s.teamNames[1])} ${tally(1)}`}</p></div>
      ${host?`<button class="btn" id="again">REMATCH</button><button class="btn ghost" id="lobby">Back to lobby</button>`:`<p class="dim">Waiting for ${esc(oname(s.hostId))} to start a rematch</p>`}
      <div class="card" style="width:100%;box-sizing:border-box;text-align:left"><span class="lbl">Every turn</span>
      ${s.history.map(h=>`<p>${esc(s.teamNames[h.team])} · <b>${esc(h.word)}</b> <span class="dim">${esc(h.speaker||"")} → ${esc(h.guesser||"")}</span> ${pts_?`<span style="color:${h.d>0?"var(--good)":"var(--bad)"}">${h.d>0?"+":"−"}${Math.abs(h.d)}</span>`:(h.ok===true?"✅":h.ok===false?"❌":"")}</p>`).join("")||`<p class="dim">No turns played.</p>`}</div>`,
      bind(){ if(host){ $("again").onclick=()=>send({type:"start"}); $("lobby").onclick=()=>send({type:"lobby"}); } } };
  }
};

// Auto-open the join screen from an invite link
{ const rc=(new URLSearchParams(location.search).get("room")||"").toUpperCase();
  if(rc && ONLINE_OK){ S.screen="online"; if(/^[A-Z]{4}$/.test(rc) && O.name) connect(rc); } }
render();
loadWords();

</script>
